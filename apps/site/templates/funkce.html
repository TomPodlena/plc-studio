<section class="page-head">
  <div class="wrap">
    <p class="eyebrow">{{page.eyebrow}}</p>
    <h1>{{page.h1}}</h1>
    <p class="lead measure">{{page.lead}}</p>
    <nav class="toc" aria-label="{{page.toc}}">
      {{#each page.groups}}
      <a href="#{{.id}}">{{.name}}</a>
      {{/each}}
    </nav>
  </div>
</section>

<section class="sec sec-tight">
  <div class="wrap features">
    {{#each page.groups}}
    <article class="feature" id="{{.id}}">
      <div class="feature-h">
        <span class="feature-n">{{@n}}</span>
        <h2>{{.name}}</h2>
        <p>{{.lead}}</p>
      </div>
      <div class="feature-b">
        <ul class="ticks">{{.points|li}}</ul>
        {{.note|note}}
      </div>
    </article>
    {{/each}}
  </div>
</section>

<section class="sec sec-tint">
  <div class="wrap measure-wrap">
    <h2>{{page.ai_title}}</h2>
    <p class="lead">{{page.ai_body}}</p>
  </div>
</section>
