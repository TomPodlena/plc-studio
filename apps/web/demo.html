<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLCdesk — demo jádra</title>
<link rel="icon" type="image/svg+xml" href="../../brand/plcdesk-favicon.svg">
<style>
  :root{--bg:#F5F6F9;--surface:#FFFFFF;--fg:#111A2E;--muted:#5A6881;--line:#D6DCE6;--accent:#2457C5;--accent-fg:#FFFFFF;--chip:#E7ECF6;--code-bg:#0B1221;--code-fg:#D4DEF2}
  body{margin:0;padding:16px 16px 48px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:1.3rem}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer}
  button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
  .cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px}
  @media(max-width:760px){.cols{grid-template-columns:1fr}}
  .list{display:flex;flex-direction:column;gap:2px;max-height:600px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
  .list h4{margin:8px 0 3px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .list button{text-align:left;font:12px/1.4 ui-monospace,monospace;border:none;background:none;padding:5px 9px;border-radius:6px;font-weight:400}
  .list button.on{background:var(--chip);color:var(--accent);font-weight:600}
  pre{background:var(--code-bg);color:var(--code-fg);font:12px/1.5 ui-monospace,monospace;padding:14px;border-radius:10px;overflow:auto;max-height:600px;white-space:pre}
  .svgbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;max-height:600px}
  .hint{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>PLCdesk — demo jádra <code>@plc-studio/core</code></h1>
  <p class="hint">Technické demo výstupů jádra. Plná aplikace: <a href="index.html">index.html</a>.</p>
  <div class="row" id="samples"></div>
  <div class="cols">
    <div class="list" id="list"></div>
    <div id="pane"></div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
