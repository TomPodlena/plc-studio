<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLCdesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>PLCdesk</h1>
    <span class="badge" id="badgeTagline">AI návrh · schéma · kód · dokumentace</span>
    <span class="badge" id="badgePlat">8 platforem</span>
    <span id="projName"></span>
    <button type="button" class="badge apprbadge" id="badgeApproval" hidden></button>
    <select id="lang" aria-label="Jazyk"></select>
  </header>
  <nav class="stepper" id="stepper" aria-label="Kroky návrhu"></nav>
  <main id="view"></main>
  <footer class="bar">
    <button id="btnPrev">← Zpět</button>
    <button id="btnNext" class="primary">Pokračovat →</button>
  </footer>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
