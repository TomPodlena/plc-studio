<title>PLC Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workflow návrhu PLC — stepper nahoře, jeden krok = jedna karta, volná navigace zpět */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#15262b; --muted:#5b7077; --line:#d4dde0;
  --accent:#00707e; --accent-fg:#ffffff; --code-bg:#0e1b1f; --code-fg:#d7e4e8;
  --ok:#1a7f37; --warn:#b45309; --err:#b3261e; --chip:#e3ecee;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a1d; --surface:#17242a; --fg:#dde8eb; --muted:#8fa6ad; --line:#2a3b42;
    --accent:#35b3c2; --accent-fg:#06272c; --code-bg:#0b1517; --code-fg:#cfe0e4;
    --ok:#4ec977; --warn:#e0a84a; --err:#ef8b84; --chip:#213237; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a1d; --surface:#17242a; --fg:#dde8eb; --muted:#8fa6ad; --line:#2a3b42;
  --accent:#35b3c2; --accent-fg:#06272c; --code-bg:#0b1517; --code-fg:#cfe0e4;
  --ok:#4ec977; --warn:#e0a84a; --err:#ef8b84; --chip:#213237; color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;margin:0;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.app{padding-block:24px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
header.app h1{font-size:1.4rem;font-weight:700;margin:0;letter-spacing:-.01em}
.badge{font-family:var(--font-mono);font-size:.7rem;background:var(--chip);padding:3px 9px;border-radius:999px;white-space:nowrap}
#projName{color:var(--muted);font-size:.9rem}
nav.stepper{display:flex;flex-wrap:wrap;gap:6px}
nav.stepper button{font-family:var(--font-mono);font-size:.74rem;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
nav.stepper button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
nav.stepper button.done{color:var(--accent);border-color:var(--accent)}
nav.stepper button.helpbtn{margin-left:auto;border-style:dashed}
nav.stepper button.helpbtn.on{background:var(--accent);color:var(--accent-fg);border-style:solid;border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.card h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.card h2 .n{font-family:var(--font-mono);color:var(--accent);margin-right:8px}
.card h3{font-size:.95rem;margin:18px 0 8px}
textarea,input[type=text],input[type=number],select{font-family:var(--font-mono);font-size:.8rem;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;box-sizing:border-box}
input[type=text],select{font-family:var(--font-body);font-size:.85rem}
textarea{width:100%;min-height:150px;line-height:1.55;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){ .g2,.g3{grid-template-columns:1fr} .card{padding:14px} }
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
button{font-family:var(--font-body);font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 16px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.small{font-size:.75rem;padding:4px 10px;font-weight:500}
button.danger{color:var(--err)}
button:hover{filter:brightness(1.05)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.hint code,p code{font-family:var(--font-mono);background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.75rem}
.note{font-size:.8rem;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-top:14px}
.warnbox{font-size:.82rem;border-left:3px solid var(--warn);padding:6px 0 6px 12px;margin-top:14px}
.errtxt{color:var(--err);font-size:.82rem;margin-top:8px}
.oktxt{color:var(--ok);font-size:.82rem;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{font-family:var(--font-mono);font-size:.74rem;background:var(--chip);border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums}
.stat b{color:var(--accent)}
.tablewrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:.83rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.mono{font-family:var(--font-mono);font-size:.76rem;white-space:nowrap;font-variant-numeric:tabular-nums}
td input[type=text]{width:100%;min-width:90px;padding:4px 7px;font-family:var(--font-mono);font-size:.76rem}
td input.dup{border-color:var(--err);outline:1px solid var(--err)}
.dirDI{color:var(--ok)} .dirDO{color:var(--warn)} .dirAI,.dirAO{color:var(--accent)}
.platgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:4px}
.plat{border:1px solid var(--line);border-radius:9px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.plat.on{border-color:var(--accent);outline:2px solid var(--accent)}
.plat b{font-size:.9rem}
.plat span{font-size:.75rem;color:var(--muted)}
.plat .lng{font-family:var(--font-mono);font-size:.68rem;color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:none;background:none;border-radius:8px 8px 0 0;padding:8px 13px;font-weight:500;color:var(--muted);font-family:var(--font-mono);font-size:.76rem}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--code-bg);font-weight:600}
.tabs.outer button[aria-selected="true"]{background:var(--chip);color:var(--fg)}
.codebox{position:relative;min-width:0}
pre.code{background:var(--code-bg);color:var(--code-fg);font-family:var(--font-mono);font-size:.74rem;line-height:1.55;margin:0;padding:16px;border-radius:0 8px 8px 8px;overflow:auto;max-height:460px;white-space:pre}
.copybtn{position:absolute;top:10px;right:10px;font-size:.74rem;padding:5px 12px}
details.help{border:1px solid var(--line);border-radius:9px;margin-top:10px;overflow:hidden}
details.help summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:.92rem;list-style:none;display:flex;gap:10px;align-items:baseline}
details.help summary::before{content:"+";font-family:var(--font-mono);color:var(--accent);font-weight:600}
details.help[open] summary::before{content:"–"}
details.help .body{padding:0 16px 14px;font-size:.88rem;max-width:75ch}
details.help .body p{margin:8px 0}
details.help .body ul{margin:6px 0;padding-left:20px}
details.help .body li{margin:3px 0}
details.help .body table{font-size:.8rem;margin-top:6px}
.seqrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.seqrow .k{font-family:var(--font-mono);font-size:.72rem;color:var(--accent);min-width:54px}
.devcard-opts{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.devcard-opts label{display:flex;gap:5px;align-items:center;cursor:pointer}
.docgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:14px;margin-top:12px}
@media (max-width:760px){ .docgrid{grid-template-columns:1fr} }
.doclist{display:flex;flex-direction:column;gap:2px;max-height:560px;overflow:auto;min-width:0;align-content:start}
.doclist h4{margin:10px 0 3px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.doclist h4:first-child{margin-top:0}
.doclist button{text-align:left;font-family:var(--font-mono);font-size:.74rem;padding:6px 10px;border:none;background:none;border-radius:6px;color:var(--fg);font-weight:400;cursor:pointer}
.doclist button[aria-selected="true"]{background:var(--chip);color:var(--accent);font-weight:600}
.svgprev{border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:520px;background:var(--surface)}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.msg{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.86rem;max-width:72ch;min-width:0}
.msg.u{align-self:flex-end;background:var(--chip)}
.msg.a{align-self:flex-start}
.msg .who{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:3px}
.stream{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);white-space:pre-wrap;max-height:180px;overflow:auto;border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin-top:10px}
footer.bar{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){ button{transition:filter .12s} }
</style>

<div class="wrap">
<header class="app">
  <h1>PLC Studio</h1>
  <span class="badge">AI návrh · schéma · kód</span>
  <span class="badge">7 platforem</span>
  <span id="projName"></span>
</header>
<nav class="stepper" id="stepper" aria-label="Kroky návrhu"></nav>
<main id="view"></main>
<footer class="bar">
  <button id="btnPrev">← Zpět</button>
  <button id="btnNext" class="primary">Pokračovat →</button>
</footer>
</div>

<script>
"use strict";
/* ============================================================ definice */
const PLAT = {
  siemens:   {name:"Siemens SIMATIC", ide:"TIA Portal V17–V21", cpu:"S7-1200 / S7-1500", lang:"SCL", imp:"externí zdroje .scl + SimaticML XML (Openness)"},
  rockwell:  {name:"Rockwell Allen-Bradley", ide:"Studio 5000", cpu:"CompactLogix / ControlLogix", lang:"ST", imp:"ST rutiny + CSV import tagů / L5X"},
  beckhoff:  {name:"Beckhoff", ide:"TwinCAT 3 (XAE)", cpu:"CX / C60xx IPC", lang:"ST", imp:"POU + GVL (vložit do editoru)"},
  codesys:   {name:"CODESYS", ide:"CODESYS V3.5", cpu:"WAGO, Festo, Eaton…", lang:"ST", imp:"POU + GVL / PLCopen XML"},
  mitsubishi:{name:"Mitsubishi", ide:"GX Works3", cpu:"MELSEC iQ-F / iQ-R", lang:"ST", imp:"ST program + global labels CSV"},
  schneider: {name:"Schneider Electric", ide:"EcoStruxure Machine Expert", cpu:"Modicon M241 / M262", lang:"ST", imp:"POU + GVL (báze CODESYS)"},
  omron:     {name:"OMRON", ide:"Sysmac Studio", cpu:"NX / NJ", lang:"ST", imp:"ST program + tabulka proměnných"}
};
const IECPLATS = ["rockwell","beckhoff","codesys","mitsubishi","schneider","omron"];
const CLS = {
  Motor:    {prefix:"M", label:"Motor / čerpadlo", opts:{fbk:"zpětné hlášení běhu", fault:"vstup poruchy"}},
  Ventil:   {prefix:"Y", label:"Ventil / válec", opts:{fbkOpen:"koncák otevřeno", fbkClosed:"koncák zavřeno"}},
  AnalogIn: {prefix:"B", label:"Analogový vstup", opts:{}},
  AnalogOut:{prefix:"U", label:"Analogový výstup", opts:{}},
  DI:       {prefix:"S", label:"Digitální vstup (snímač)", opts:{}},
  DO:       {prefix:"H", label:"Digitální výstup (signálka…)", opts:{}}
};
const STEPS = ["Projekt","AI návrh","Platformy","Zařízení","I/O","Schéma","Program","Generovat","Dokumentace"];

/* ============================================================ stav */
const BLANK = () => ({
  meta:{name:"", desc:""},
  platforms:["siemens"],
  ai:{turns:[], last:null, draft:""},
  devices:[],            // {id,name,cls,desc,opt:{},unit,rmin,rmax}
  io:[],                 // {key,devId,sig,dir,tag,addr,cmt}
  program:{modes:true, estop:"", seq:[]},   // seq: {dev,act,cond,timeS}
  imported:{info:"", blocks:[]},
  step:0, nextId:1
});
let P = BLANK();
function save(){ try{ localStorage.setItem("plcstudio", JSON.stringify(P)); }catch(e){} }
function load(){ try{ const s = localStorage.getItem("plcstudio"); if(s){ P = Object.assign(BLANK(), JSON.parse(s)); } }catch(e){} }

/* ============================================================ pomůcky */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const xmlEsc = esc;
function stripDia(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,""); }
function devById(id){ return P.devices.find(d=>d.id===id); }
function nextName(cls){
  const pre = CLS[cls].prefix; let n = 1;
  while(P.devices.some(d=>d.name===pre+n)) n++;
  return pre+n;
}

/* signály odvozené z třídy zařízení */
function devSignals(d){
  const o = d.opt||{}; const s = [];
  if(d.cls==="Motor"){
    if(o.fbk!==false) s.push(["fbkRunning","DI","běh"]);
    if(o.fault) s.push(["fault","DI","porucha"]);
    s.push(["outRun","DO","povel chod"]);
  } else if(d.cls==="Ventil"){
    if(o.fbkOpen!==false) s.push(["fbkOpen","DI","otevřeno"]);
    if(o.fbkClosed) s.push(["fbkClosed","DI","zavřeno"]);
    s.push(["outOpen","DO","povel otevřít"]);
  } else if(d.cls==="AnalogIn") s.push(["raw","AI",(d.unit||"")]);
  else if(d.cls==="AnalogOut") s.push(["raw","AO",(d.unit||"")]);
  else if(d.cls==="DI") s.push(["in","DI",""]);
  else if(d.cls==="DO") s.push(["out","DO",""]);
  return s;
}
/* synchronizace I/O tabulky se zařízeními (edity se zachovají) */
function syncIO(){
  const fresh = [];
  for(const d of P.devices){
    for(const [sig,dir,lbl] of devSignals(d)){
      const key = d.id+":"+sig;
      const old = P.io.find(e=>e.key===key);
      fresh.push(old || {key, devId:d.id, sig, dir, tag:d.name+"_"+sig, addr:"",
        cmt:(d.desc?d.desc+" – ":"")+lbl,
        nc: dir==="DI" && /\bNC\b/i.test(d.desc||"")});
    }
  }
  P.io = fresh;
  autoAddr(false);
}
function autoAddr(force){
  let di=0, dq=0, ai=64, ao=64;
  const taken = new Set(force?[]:P.io.filter(e=>e.addr).map(e=>e.addr));
  const next = dir=>{
    let a;
    for(;;){
      if(dir==="DI"){ a="%I"+(di>>3)+"."+(di&7); di++; }
      else if(dir==="DO"){ a="%Q"+(dq>>3)+"."+(dq&7); dq++; }
      else if(dir==="AI"){ a="%IW"+ai; ai+=2; }
      else { a="%QW"+ao; ao+=2; }
      if(!taken.has(a)) return a;
    }
  };
  for(const e of P.io){ if(force || !e.addr){ e.addr = next(e.dir); taken.add(e.addr); } }
}
function addrFor(plat, e){
  const a = e.addr||"";
  if(plat==="siemens") return a;
  if(["beckhoff","codesys","schneider"].includes(plat)){
    const m = a.match(/^%([IQ])(\d+)\.(\d+)$/);
    return m ? "%"+m[1]+"X"+m[2]+"."+m[3] : a;
  }
  if(plat==="mitsubishi"){
    const m = a.match(/^%([IQ])(\d+)\.(\d+)$/);
    if(m) return (m[1]==="I"?"X":"Y")+((+m[2])*8+(+m[3])).toString(16).toUpperCase();
    return "";
  }
  return "";
}
function dtFor(e){ return (e.dir==="AI"||e.dir==="AO") ? "INT" : "BOOL"; }

/* ============================================================ import / reverse engineering */
function detectAndParse(text){
  const t = text.trim();
  if(!t) return {fmt:"", tags:[], blocks:[]};
  if(/<SW\.Tags\.PlcTagTable/i.test(t)) return parseSimaticML(t);
  if(/<RSLogix5000Content|<Controller[\s>]/i.test(t)) return parseL5X(t);
  if(/VAR_GLOBAL/i.test(t) || /FUNCTION_BLOCK|PROGRAM\s+\w+|ORGANIZATION_BLOCK/i.test(t)) return parseSTSource(t);
  if(/^TYPE,SCOPE,NAME/im.test(t) || /^TAG,/im.test(t)) return parseRockwellCSV(t);
  if(/\t.*\t/.test(t.split(/\r?\n/)[0]||"") && /BOOL|Bit|INT|REAL|WORD/i.test(t)) return parseLabelTable(t);
  return parsePlainIO(t);
}
function normAddr(a){
  if(!a) return "";
  a = a.trim().toUpperCase();
  let m = a.match(/^%([IQ])X?(\d+)\.(\d+)$/); if(m) return "%"+m[1]+m[2]+"."+m[3];
  m = a.match(/^%([IQ])[WD](\d+)/); if(m) return "%"+m[1]+"W"+m[2];
  m = a.match(/^X([0-9A-F]+)$/); if(m){ const i=parseInt(m[1],16); return "%I"+(i>>3)+"."+(i&7); }
  m = a.match(/^Y([0-9A-F]+)$/); if(m){ const i=parseInt(m[1],16); return "%Q"+(i>>3)+"."+(i&7); }
  return "";
}
function guessDir(name, dt, addr){
  if(/^%I\d+\.\d+$/.test(addr)) return "DI";
  if(/^%Q\d+\.\d+$/.test(addr)) return "DO";
  if(/^%IW/.test(addr)) return "AI";
  if(/^%QW/.test(addr)) return "AO";
  if(/INT|REAL|WORD|DINT/i.test(dt||"")) return /out|set|sp|cmd/i.test(name)?"AO":"AI";
  return /out|cmd|povel|run$|open$|lamp|valve|^Y|^H/i.test(name)?"DO":"DI";
}
function parseSimaticML(t){
  const tags = [];
  try{
    const doc = new DOMParser().parseFromString(t,"text/xml");
    const els = doc.getElementsByTagName("SW.Tags.PlcTag");
    for(const el of els){
      const get = n => { for(const c of el.getElementsByTagName(n)){ if(c.parentElement && c.parentElement.tagName==="AttributeList") return c.textContent.trim(); } return ""; };
      const name = get("Name"), dt = get("DataTypeName"), la = get("LogicalAddress");
      let cmt = ""; const mt = el.getElementsByTagName("Text"); if(mt.length) cmt = mt[0].textContent.trim();
      if(name) tags.push({tag:name, dt, addr:normAddr(la), cmt});
    }
  }catch(e){}
  return {fmt:"Siemens SimaticML (tabulka tagů)", tags, blocks:[]};
}
function parseL5X(t){
  const tags = [], blocks = [];
  try{
    const doc = new DOMParser().parseFromString(t,"text/xml");
    for(const el of doc.getElementsByTagName("Tag")){
      const name = el.getAttribute("Name")||"", dt = el.getAttribute("DataType")||"";
      if(!name || !/^(BOOL|INT|DINT|SINT|REAL)$/i.test(dt)) continue;
      let cmt=""; const d = el.getElementsByTagName("Description"); if(d.length) cmt = d[0].textContent.trim();
      tags.push({tag:name, dt, addr:"", cmt});
    }
    for(const el of doc.getElementsByTagName("AddOnInstructionDefinition")) blocks.push("AOI "+(el.getAttribute("Name")||""));
    for(const el of doc.getElementsByTagName("Routine")) blocks.push("Routine "+(el.getAttribute("Name")||""));
  }catch(e){}
  return {fmt:"Rockwell L5X", tags, blocks};
}
function parseSTSource(t){
  const tags = [], blocks = [];
  let m; const reB = /(FUNCTION_BLOCK|PROGRAM|FUNCTION|ORGANIZATION_BLOCK|DATA_BLOCK)\s+"?([A-Za-z_]\w*)"?/g;
  while((m = reB.exec(t))) blocks.push(m[1]+" "+m[2]);
  const reG = /VAR_GLOBAL[\s\S]*?END_VAR/gi; let g;
  while((g = reG.exec(t))){
    for(const line of g[0].split(/\r?\n/)){
      const lm = line.match(/^\s*([A-Za-z_]\w*)\s*(?:AT\s*(%[\w.]+))?\s*:\s*([A-Za-z_]\w*)\s*(?::=[^;]*)?;\s*(?:\(\*\s*(.*?)\s*\*\)|\/\/\s*(.*))?/);
      if(lm && !/^VAR|^END/i.test(lm[1])) tags.push({tag:lm[1], dt:lm[3], addr:normAddr(lm[2]||""), cmt:(lm[4]||lm[5]||"").trim()});
    }
  }
  return {fmt:"ST / SCL zdroj"+(tags.length?" + VAR_GLOBAL":""), tags, blocks};
}
function parseRockwellCSV(t){
  const tags = [];
  for(const line of t.split(/\r?\n/)){
    const c = line.split(",");
    if((c[0]||"").trim().toUpperCase()!=="TAG") continue;
    const name=(c[2]||"").trim(), cmt=(c[3]||"").replace(/^"|"$/g,"").trim(), dt=(c[4]||"").trim();
    if(name) tags.push({tag:name, dt, addr:"", cmt});
  }
  return {fmt:"Rockwell CSV export tagů", tags, blocks:[]};
}
function parseLabelTable(t){
  const tags = []; const lines = t.split(/\r?\n/).filter(Boolean);
  for(const line of lines){
    const c = line.split("\t").map(x=>x.replace(/^"|"$/g,"").trim());
    if(!c[0] || /^(label name|name|název)/i.test(c[0])) continue;
    const dt = (c[1]||"").replace(/^Bit$/i,"BOOL").replace(/^Word.*$/i,"INT");
    const at = c.find(x=>/^[XY][0-9A-F]+$|^%[IQ]/.test(x))||"";
    const cmt = c.slice(2).find(x=>x && !/^[XY][0-9A-F]+$|^%|^VAR|^FALSE|^TRUE|^Retain/i.test(x))||"";
    tags.push({tag:c[0], dt, addr:normAddr(at), cmt});
  }
  return {fmt:"Tabulka proměnných (Mitsubishi / OMRON)", tags, blocks:[]};
}
function parsePlainIO(t){
  const tags = [];
  for(const line of t.split(/\r?\n/)){
    const l = line.trim(); if(!l) continue;
    const delim = l.includes("\t")?"\t":(l.includes(";")?";":",");
    const c = l.split(delim).map(x=>x.trim());
    if(/^tag/i.test(c[0])||/adres/i.test(c[1]||"")) continue;
    if(c.length<2 || !/^%[IQ]/i.test(c[1]||"")) continue;
    tags.push({tag:c[0], dt:"", addr:normAddr(c[1]), cmt:c[4]||c[2]||"", dev:c[2]||"", cls:c[3]||""});
  }
  return {fmt:"Prostý I/O list (Tag;Adresa;Zařízení;Třída;Komentář)", tags, blocks:[]};
}
/* seskupení importovaných tagů do zařízení */
function buildDevicesFromTags(tags){
  const groups = {};
  for(const tg of tags){
    const dev = tg.dev || (tg.tag.includes("_") ? tg.tag.split("_")[0] : tg.tag);
    (groups[dev] = groups[dev] || []).push(tg);
  }
  const devices = [], io = [];
  let id = 1;
  for(const [name, list] of Object.entries(groups)){
    for(const tg of list) tg._dir = guessDir(tg.tag, tg.dt, tg.addr);
    let cls = list[0].cls && CLS[list[0].cls] ? list[0].cls : "";
    if(!cls){
      if(list.some(t=>t._dir==="AI")) cls="AnalogIn";
      else if(list.some(t=>t._dir==="AO")) cls="AnalogOut";
      else if(/^M\d*$/i.test(name) && list.some(t=>t._dir==="DO")) cls="Motor";
      else if(/^[YV]\d*$/i.test(name) && list.some(t=>t._dir==="DO")) cls="Ventil";
      else cls = list.every(t=>t._dir==="DO") ? "DO" : "DI";
    }
    const desc = (list.find(t=>t.cmt)||{}).cmt||"";
    const d = {id:id, name, cls, desc:desc.split("–")[0].split("-")[0].trim(), opt:{}, unit:"", rmin:0, rmax:100};
    if(cls==="Motor"){ d.opt.fbk = list.some(t=>t._dir==="DI"&&/run|chod|fbk/i.test(t.tag)); d.opt.fault = list.some(t=>/fault|flt|por|err/i.test(t.tag)); }
    if(cls==="Ventil"){ d.opt.fbkOpen = list.some(t=>/open|otv/i.test(t.tag)&&t._dir==="DI"); d.opt.fbkClosed = list.some(t=>/clos|zav/i.test(t.tag)&&t._dir==="DI"); }
    devices.push(d);
    /* napojení skutečných tagů na role */
    for(const [sig,dir] of devSignals(d).map(x=>[x[0],x[1]])){
      let src = null;
      if(sig==="fbkRunning") src = list.find(t=>t._dir==="DI"&&/run|chod|fbk/i.test(t.tag));
      else if(sig==="fault") src = list.find(t=>/fault|flt|por|err/i.test(t.tag));
      else if(sig==="outRun"||sig==="outOpen"||sig==="out") src = list.find(t=>t._dir==="DO");
      else if(sig==="fbkOpen") src = list.find(t=>t._dir==="DI"&&/open|otv/i.test(t.tag));
      else if(sig==="fbkClosed") src = list.find(t=>t._dir==="DI"&&/clos|zav/i.test(t.tag));
      else if(sig==="raw") src = list.find(t=>t._dir==="AI"||t._dir==="AO");
      else if(sig==="in") src = list.find(t=>t._dir==="DI");
      io.push({key:id+":"+sig, devId:id, sig, dir, tag:src?src.tag:name+"_"+sig, addr:src?src.addr:"", cmt:src?src.cmt:""});
    }
    id++;
  }
  return {devices, io, nextId:id};
}

const SCL_MOTOR = `FUNCTION_BLOCK "FB_Motor"
{ S7_Optimized_Access := 'TRUE' }
VERSION : 0.1
// Šablona: motor/čerpadlo se zpětným hlášením běhu
VAR_INPUT
    enable : Bool;
    cmdStart : Bool;
    cmdStop : Bool;
    fbkRunning : Bool;
    fault : Bool;
END_VAR
VAR_OUTPUT
    outRun : Bool;
    busy : Bool;
    error : Bool;
    status : Word;
END_VAR
VAR
    statStep : Int;
    instTrigStart : R_TRIG;
    instTrigStop : R_TRIG;
    instTonFbk : TON;
END_VAR
VAR CONSTANT
    STEP_IDLE : Int := 0;
    STEP_STARTING : Int := 10;
    STEP_RUNNING : Int := 20;
    STEP_ERROR : Int := 90;
    T_FBK : Time := T#3S;
END_VAR

BEGIN
    IF NOT #enable THEN
        #outRun := FALSE; #busy := FALSE; #error := FALSE;
        #status := 16#8001; #statStep := #STEP_IDLE;
        RETURN;
    END_IF;

    #instTrigStart(CLK := #cmdStart);
    #instTrigStop(CLK := #cmdStop);

    CASE #statStep OF
        #STEP_IDLE:
            #outRun := FALSE;
            IF #instTrigStart.Q THEN #statStep := #STEP_STARTING; END_IF;
        #STEP_STARTING:
            #outRun := TRUE;
            IF #fbkRunning THEN #statStep := #STEP_RUNNING; END_IF;
        #STEP_RUNNING:
            #outRun := TRUE;
            IF NOT #fbkRunning THEN #statStep := #STEP_ERROR; END_IF;
            IF #instTrigStop.Q THEN #statStep := #STEP_IDLE; END_IF;
        #STEP_ERROR:
            #outRun := FALSE;
            IF #instTrigStop.Q AND NOT #fault THEN #statStep := #STEP_IDLE; END_IF;
    END_CASE;

    #instTonFbk(IN := (#statStep = #STEP_STARTING), PT := #T_FBK);
    IF #instTonFbk.Q OR #fault THEN #statStep := #STEP_ERROR; END_IF;

    #busy := (#statStep = #STEP_STARTING);
    #error := (#statStep = #STEP_ERROR);
    IF #error THEN #status := 16#8002; ELSE #status := 16#0000; END_IF;
END_FUNCTION_BLOCK`;

const SCL_VENTIL = `FUNCTION_BLOCK "FB_Ventil"
{ S7_Optimized_Access := 'TRUE' }
VERSION : 0.1
// Šablona: dvoupolohový ventil/válec s koncovými snímači
VAR_INPUT
    enable : Bool;
    cmdOpen : Bool;
    cmdClose : Bool;
    fbkOpen : Bool;
    fbkClosed : Bool;
END_VAR
VAR_OUTPUT
    outOpen : Bool;
    busy : Bool;
    error : Bool;
    status : Word;
END_VAR
VAR
    statStep : Int;
    instTrigOpen : R_TRIG;
    instTrigClose : R_TRIG;
    instTonTravel : TON;
END_VAR
VAR CONSTANT
    STEP_CLOSED : Int := 0;
    STEP_OPENING : Int := 10;
    STEP_OPEN : Int := 20;
    STEP_CLOSING : Int := 30;
    STEP_ERROR : Int := 90;
    T_TRAVEL : Time := T#5S;
END_VAR

BEGIN
    IF NOT #enable THEN
        #outOpen := FALSE; #busy := FALSE; #error := FALSE;
        #status := 16#8001; #statStep := #STEP_CLOSED;
        RETURN;
    END_IF;

    #instTrigOpen(CLK := #cmdOpen);
    #instTrigClose(CLK := #cmdClose);

    CASE #statStep OF
        #STEP_CLOSED:
            #outOpen := FALSE;
            IF #instTrigOpen.Q THEN #statStep := #STEP_OPENING; END_IF;
        #STEP_OPENING:
            #outOpen := TRUE;
            IF #fbkOpen THEN #statStep := #STEP_OPEN; END_IF;
        #STEP_OPEN:

            IF #fbkClosed THEN #statStep := #STEP_CLOSED; END_IF;
        #STEP_ERROR:
            #outOpen := FALSE;
            IF #instTrigClose.Q THEN #statStep := #STEP_CLOSED; END_IF;
    END_CASE;

    #instTonTravel(IN := (#statStep = #STEP_OPENING) OR (#statStep = #STEP_CLOSING),
                   PT := #T_TRAVEL);
    IF #instTonTravel.Q THEN #statStep := #STEP_ERROR; END_IF;

    #busy := (#statStep = #STEP_OPENING) OR (#statStep = #STEP_CLOSING);
    #error := (#statStep = #STEP_ERROR);

END_FUNCTION_BLOCK`;

const SCL_AI = `FUNCTION_BLOCK "FB_AnalogIn"
{ S7_Optimized_Access := 'TRUE' }
VERSION : 0.1
// Šablona: analogový vstup se škálováním a mezemi
VAR_INPUT
    rawValue : Int;            // 0..27648
    scaleMin : Real := 0.0;
    scaleMax : Real := 100.0;

VAR_OUTPUT
    value : Real;
    alarmHi : Bool;
    alarmLo : Bool;
END_VAR

BEGIN
    #value := NORM_X(MIN := 0, VALUE := #rawValue, MAX := 27648)

const SCL_AO = `FUNCTION_BLOCK "FB_AnalogOut"

/* ============================================================ šablony — IEC ST (ostatní platformy) */
const ST_MOTOR = `FUNCTION_BLOCK FB_Motor
(* Sablona: motor/cerpadlo se zpetnym hlasenim behu *)
VAR_INPUT
    enable : BOOL;
    cmdStart : BOOL;
    cmdStop : BOOL;
    fbkRunning : BOOL;
    fault : BOOL;
END_VAR
VAR_OUTPUT
    outRun : BOOL;
    busy : BOOL;
    error : BOOL;
    status : WORD;
END_VAR
VAR
    statStep : INT;
    lastStart : BOOL;
    lastStop : BOOL;
    trigStart : BOOL;
    trigStop : BOOL;
    tonFbk : TON;
END_VAR

IF NOT enable THEN
    outRun := FALSE; busy := FALSE; error := FALSE;
    status := 16#8001; statStep := 0;
    RETURN;
END_IF;

(* detekce hran *)
trigStart := cmdStart AND NOT lastStart;  lastStart := cmdStart;
trigStop  := cmdStop  AND NOT lastStop;   lastStop  := cmdStop;

CASE statStep OF
    0: (* IDLE *)
        outRun := FALSE;
        IF trigStart THEN statStep := 10; END_IF
    10: (* STARTING *)
        outRun := TRUE;
        IF fbkRunning THEN statStep := 20; END_IF
    20: (* RUNNING *)
        outRun := TRUE;
        IF NOT fbkRunning THEN statStep := 90; END_IF
        IF trigStop THEN statStep := 0; END_IF
    90: (* ERROR *)
        outRun := FALSE;
        IF trigStop AND NOT fault THEN statStep := 0; END_IF
END_CASE;

tonFbk(IN := (statStep = 10), PT := T#3S);
IF tonFbk.Q OR fault THEN statStep := 90; END_IF;

busy := (statStep = 10);
error := (statStep = 90);
IF error THEN status := 16#8002; ELSE status := 16#0000; END_IF;
END_FUNCTION_BLOCK`;

const ST_VENTIL = `FUNCTION_BLOCK FB_Ventil
(* Sablona: dvoupolohovy ventil/valec s koncovymi snimaci *)
VAR_INPUT
    enable : BOOL;
    cmdOpen : BOOL;
    cmdClose : BOOL;
    fbkOpen : BOOL;
    fbkClosed : BOOL;
END_VAR
VAR_OUTPUT
    outOpen : BOOL;
    busy : BOOL;
    error : BOOL;
    status : WORD;
END_VAR
VAR
    statStep : INT;
    lastOpen : BOOL;
    lastClose : BOOL;
    trigOpen : BOOL;
    trigClose : BOOL;
    tonTravel : TON;
END_VAR

IF NOT enable THEN
    outOpen := FALSE; busy := FALSE; error := FALSE;
    status := 16#8001; statStep := 0;
    RETURN;
END_IF;

trigOpen  := cmdOpen  AND NOT lastOpen;   lastOpen  := cmdOpen;
trigClose := cmdClose AND NOT lastClose;  lastClose := cmdClose;

CASE statStep OF
    0: (* CLOSED *)
        outOpen := FALSE;
        IF trigOpen THEN statStep := 10; END_IF
    10: (* OPENING *)
        outOpen := TRUE;
        IF fbkOpen THEN statStep := 20; END_IF
    20: (* OPEN *)
        outOpen := TRUE;
        IF trigClose THEN statStep := 30; END_IF
    30: (* CLOSING *)
        outOpen := FALSE;
        IF fbkClosed THEN statStep := 0; END_IF
    90: (* ERROR *)
        outOpen := FALSE;
        IF trigClose THEN statStep := 0; END_IF
END_CASE;

tonTravel(IN := (statStep = 10) OR (statStep = 30), PT := T#5S);
IF tonTravel.Q THEN statStep := 90; END_IF;

busy := (statStep = 10) OR (statStep = 30);
error := (statStep = 90);
IF error THEN status := 16#8002; ELSE status := 16#0000; END_IF;
END_FUNCTION_BLOCK`;

const ST_AI = `FUNCTION_BLOCK FB_AnalogIn
(* Sablona: analogovy vstup se skalovanim a mezemi.
   POZOR: surovy rozsah uprav dle platformy (Siemens 27648,
   Rockwell dle modulu/inz. jednotek, Beckhoff 32767...) *)
VAR_INPUT
    rawValue : INT;
    rawMax : INT := 27648;
    scaleMin : REAL := 0.0;
    scaleMax : REAL := 100.0;
    limitHi : REAL := 1.0E+6;
    limitLo : REAL := -1.0E+6;
END_VAR
VAR_OUTPUT
    value : REAL;
    alarmHi : BOOL;
    alarmLo : BOOL;
END_VAR

value := INT_TO_REAL(rawValue) / INT_TO_REAL(rawMax)
         * (scaleMax - scaleMin) + scaleMin;
alarmHi := value > limitHi;
alarmLo := value < limitLo;
END_FUNCTION_BLOCK`;

const ST_AO = `FUNCTION_BLOCK FB_AnalogOut
(* Sablona: analogovy vystup — inzenyrske jednotky -> surova hodnota *)
VAR_INPUT
    value : REAL;
    rawMax : INT := 27648;
    scaleMin : REAL := 0.0;
    scaleMax : REAL := 100.0;
END_VAR
VAR_OUTPUT
    rawValue : INT;
END_VAR

rawValue := REAL_TO_INT((value - scaleMin) / (scaleMax - scaleMin)
            * INT_TO_REAL(rawMax));
END_FUNCTION_BLOCK`;

/* ============================================================ generování */
function ioOf(dev){ const o={}; for(const e of P.io) if(e.devId===dev.id) o[e.sig]=e; return o; }
function usedClasses(){ return new Set(P.devices.map(d=>d.cls)); }
function instName(d){ return "inst"+d.name; }

/* reference na globální tag dle platformy */
function refFn(plat){
  if(plat==="siemens") return t=>'"'+t+'"';
  if(["beckhoff","codesys","schneider"].includes(plat)) return t=>"GVL_IO."+t;
  return t=>t;
}
/* lokální proměnná dle dialektu */
function locFn(plat){ return plat==="siemens" ? v=>"#"+v : v=>v; }

/* sekvence: latchované povely + přechody */
function seqVars(){
  const vars = new Set();
  for(const s of P.program.seq){
    const d = devById(s.dev);
    if(!d) continue;
    if(d.cls==="Motor") vars.add("seqRun_"+d.name);
    if(d.cls==="Ventil") vars.add("seqOpen_"+d.name);
  }
  return [...vars];
}
function seqTimedSteps(){
  const list = [];
  P.program.seq.forEach((s,i)=>{ if(s.act==="wait" || s.cond==="time") list.push(10+i*10); });
  return list;
}
function seqBody(plat){
  const L = locFn(plat), R = refFn(plat);
  const steps = P.program.seq;
  if(!steps.length) return "";
  let b = "";
  const cmt = plat==="siemens" ? (t)=>"// "+t : (t)=>"(* "+t+" *)";
  b += "    "+cmt("--- Automatická sekvence (režim AUTO) ---")+"\n";
  b += "    IF NOT "+L("modeAuto")+" OR NOT "+L("enable")+" THEN\n";
  b += "        "+L("seqStep")+" := 0;\n";
  for(const v of seqVars()) b += "        "+L(v)+" := FALSE;\n";
  b += "    END_IF;\n\n";
  b += "    CASE "+L("seqStep")+" OF\n";
  b += "        0: "+cmt("čekání na start")+"\n";
  b += "            IF "+L("modeAuto")+" AND "+L("cmdAutoStart")+" THEN "+L("seqStep")+" := 10; END_IF"+(plat==="siemens"?";":"")+"\n";
  steps.forEach((s,i)=>{
    const n = 10+i*10, next = (i===steps.length-1) ? 0 : 10+(i+1)*10;
    const d = devById(s.dev);
    let title = "", action = "", cond = "";
    if(s.act==="wait"){
      title = "výdrž "+(s.timeS||1)+" s";
      cond = L("tonSeq"+n)+".Q";
    } else if(d && d.cls==="Motor"){
      title = d.name+" "+(s.act==="start"?"start":"stop");
      action = "            "+L("seqRun_"+d.name)+" := "+(s.act==="start"?"TRUE":"FALSE")+";\n";
      const io = ioOf(d);
      if(s.cond==="time") cond = L("tonSeq"+n)+".Q";
      else if(io.fbkRunning) cond = (s.act==="start"?"":"NOT ")+R(io.fbkRunning.tag);
      else cond = "TRUE "+cmt("bez zpětného hlášení");
    } else if(d && d.cls==="Ventil"){
      title = d.name+" "+(s.act==="open"?"otevřít":"zavřít");
      action = "            "+L("seqOpen_"+d.name)+" := "+(s.act==="open"?"TRUE":"FALSE")+";\n";
      const io = ioOf(d);
      if(s.cond==="time") cond = L("tonSeq"+n)+".Q";
      else if(s.act==="open" && io.fbkOpen) cond = R(io.fbkOpen.tag);
      else if(s.act==="close" && io.fbkClosed) cond = R(io.fbkClosed.tag);
      else cond = "TRUE "+cmt("bez koncového snímače");
    } else { title = "krok"; cond = "TRUE"; }
    b += "        "+n+": "+cmt("Krok "+(i+1)+": "+title)+"\n";
    b += action;
    b += "            IF "+cond+" THEN "+L("seqStep")+" := "+next+"; END_IF"+(plat==="siemens"?";":"")+"\n";
  });
  b += "    END_CASE;\n\n";
  for(const n of seqTimedSteps()){
    const s = P.program.seq[(n-10)/10];
    b += "    "+L("tonSeq"+n)+"(IN := ("+L("seqStep")+" = "+n+"), PT := T#"+(s.timeS||1)+"S);\n";
  }
  return b;
}
function seqDecls(plat){
  const out = [];
  out.push("    modeAuto : BOOL;      "+(plat==="siemens"?"// TODO: přepínač režimu (HMI)":"(* TODO: prepinac rezimu (HMI) *)"));
  out.push("    cmdAutoStart : BOOL;  "+(plat==="siemens"?"// TODO: tlačítko start auto":"(* TODO: tlacitko start auto *)"));
  out.push("    seqStep : INT;");
  for(const v of seqVars()) out.push("    "+v+" : BOOL;");
  for(const n of seqTimedSteps()) out.push("    tonSeq"+n+" : TON;");
  return out.join("\n");
}

/* zapojení instancí */
function wiring(plat){
  const R = refFn(plat), L = locFn(plat);
  const inst = [], calls = [], free = [];
  const hasSeq = P.program.seq.length>0;
  for(const d of P.devices){
    const io = ioOf(d);
    const title = d.name+(d.desc?" – "+d.desc:"");
    const c = plat==="siemens" ? "    // "+title : "    (* "+title+" *)";
    if(d.cls==="Motor"){
      inst.push({n:instName(d), t:"FB_Motor"});
      const auto = hasSeq && seqVars().includes("seqRun_"+d.name);
      calls.push(c+"\n    "+L(instName(d))+"(enable := "+L("enable")+",\n"+
        "        cmdStart := "+(auto?L("seqRun_"+d.name):"FALSE")+", "+(plat==="siemens"?"// TODO: + ruční povel z HMI":"(* TODO: + rucni povel z HMI *)")+"\n"+
        "        cmdStop := "+(auto?"NOT "+L("seqRun_"+d.name):"FALSE")+",\n"+
        "        fbkRunning := "+(io.fbkRunning?R(io.fbkRunning.tag):"TRUE")+","+(io.fbkRunning?"":" "+(plat==="siemens"?"// bez zpětného hlášení":"(* bez zpetneho hlaseni *)"))+"\n"+
        "        fault := "+(io.fault?R(io.fault.tag):"FALSE")+",\n"+
        "        outRun => "+(io.outRun?R(io.outRun.tag):L("tempUnused"))+");");
    } else if(d.cls==="Ventil"){
      inst.push({n:instName(d), t:"FB_Ventil"});
      const auto = hasSeq && seqVars().includes("seqOpen_"+d.name);
      calls.push(c+"\n    "+L(instName(d))+"(enable := "+L("enable")+",\n"+
        "        cmdOpen := "+(auto?L("seqOpen_"+d.name):"FALSE")+", "+(plat==="siemens"?"// TODO: + ruční povel":"(* TODO: + rucni povel *)")+"\n"+
        "        cmdClose := "+(auto?"NOT "+L("seqOpen_"+d.name):"FALSE")+",\n"+
        "        fbkOpen := "+(io.fbkOpen?R(io.fbkOpen.tag):"TRUE")+",\n"+
        "        fbkClosed := "+(io.fbkClosed?R(io.fbkClosed.tag):"TRUE")+",\n"+
        "        outOpen => "+(io.outOpen?R(io.outOpen.tag):L("tempUnused"))+");");
    } else if(d.cls==="AnalogIn"){
      inst.push({n:instName(d), t:"FB_AnalogIn"});
      calls.push(c+"\n    "+L(instName(d))+"(rawValue := "+(io.raw?R(io.raw.tag):"0")+",\n"+
        "        scaleMin := "+fmtR(d.rmin)+", scaleMax := "+fmtR(d.rmax)+"); "+(plat==="siemens"?"// "+(d.unit||"jednotky dle snímače"):"(* "+stripDia(d.unit||"jednotky dle snimace")+" *)"));
    } else if(d.cls==="AnalogOut"){
      inst.push({n:instName(d), t:"FB_AnalogOut"});
      calls.push(c+"\n    "+L(instName(d))+"(value := 0.0, "+(plat==="siemens"?"// TODO: žádaná hodnota":"(* TODO: zadana hodnota *)")+"\n"+
        "        scaleMin := "+fmtR(d.rmin)+", scaleMax := "+fmtR(d.rmax)+",\n"+
        "        rawValue => "+(io.raw?R(io.raw.tag):L("tempUnused2"))+");");
    } else {
      for(const e of Object.values(io)) free.push("    "+(plat==="siemens"?"//":"(*")+"   "+(e.addr||"").padEnd(8)+" "+R(e.tag)+"  "+(plat==="siemens"?e.cmt:stripDia(e.cmt)+" *)"));
    }
  }
  return {inst, calls, free};
}
function fmtR(v){ const n = Number(v); return Number.isFinite(n) ? (Number.isInteger(n)?n+".0":String(n)) : "0.0"; }
function enableExpr(plat){
  const R = refFn(plat);
  const es = devById(P.program.estop);
  if(es){ const io = ioOf(es); const e = io.in||Object.values(io)[0];

    x += '      <SW.Tags.PlcTag ID="'+nid()+'" CompositionName="Tags">\n        <AttributeList>\n          <DataTypeName>'+(e.dir==="AI"||e.dir==="AO"?"Int":"Bool")+'</DataTypeName>\n          <LogicalAddress>'+xmlEsc(e.addr)+'</LogicalAddress>\n          <Name>'+xmlEsc(e.tag)+'</Name>\n        </AttributeList>\n';
    if(e.cmt) x += '        <ObjectList>\n          <MultilingualText ID="'+nid()+'" CompositionName="Comment">\n            <ObjectList>\n              <MultilingualTextItem ID="'+nid()+'" CompositionName="Items">\n                <AttributeList>\n                  <Culture>cs-CZ</Culture>\n                  <Text>'+xmlEsc(e.cmt)+'</Text>\n                </AttributeList>\n              </MultilingualTextItem>\n            </ObjectList>\n          </MultilingualText>\n        </ObjectList>\n';

function genLibrary(plat){
  const u = usedClasses(); const parts = [];
  const hdr = plat==="siemens"
    ? "// Gen_Library.scl – knihovna šablon (generováno PLC Studio)\n// Import: External source files → Generate blocks from source (PŘED Gen_Main)"
    : "(* Gen_Library.st - knihovna sablon (generovano PLC Studio) - "+PLAT[plat].name+" *)";
  parts.push(hdr,"");
  const T = plat==="siemens" ? {Motor:SCL_MOTOR,Ventil:SCL_VENTIL,AnalogIn:SCL_AI,AnalogOut:SCL_AO}
                             : {Motor:ST_MOTOR,Ventil:ST_VENTIL,AnalogIn:ST_AI,AnalogOut:ST_AO};
  for(const c of ["Motor","Ventil","AnalogIn","AnalogOut"]) if(u.has(c)) parts.push(T[c],"");

  return parts.join("\n");
}

function genTagFile(plat){

  }
  if(plat==="mitsubishi"){
    const l = ['"Label Name","Data Type","Class","Comment","Assign (Device/Label)"'];
    for(const e of P.io) l.push('"'+e.tag+'","'+(dtFor(e)==="INT"?"Word [Signed]":"Bit")+'","VAR_GLOBAL","'+stripDia(e.cmt).replace(/"/g,"'")+'","'+addrFor(plat,e)+'"');

}

function genFor(plat){
  const files = {};
  if(plat==="siemens"){
    files["Gen_IO.xml"] = genSiemensTagsXml();
    files["Gen_Library.scl"] = genLibrary("siemens");
    files["Gen_Main.scl"] = genMainSiemens();
  } else {
    const tf = genTagFile(plat);
    files[tf.name] = tf.body;
    files["Gen_Library.st"] = genLibrary(plat);
    files["MAIN.st"] = genMainIEC(plat);
  }
  files["README.txt"] = genReadme(plat);
  return files;
}

function render(){
  const nav = $("stepper");
  nav.innerHTML = STEPS.map((s,i)=>'<button class="'+(i===P.step?"on":(stepDone(i)?"done":""))+'" data-i="'+i+'">'+(i+1)+" · "+s+"</button>").join("")
    + '<button class="helpbtn'+(P.step==="help"?" on":"")+'" data-help>?&nbsp;Nápověda</button>';
  nav.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ P.step = b.hasAttribute("data-help") ? "help" : +b.dataset.i; save(); render(); }));
  $("projName").textContent = P.meta.name ? "— "+P.meta.name : "";
  const num = typeof P.step === "number";
  $("btnPrev").style.visibility = (num && P.step>0) ? "visible":"hidden";
  $("btnNext").style.visibility = (num && P.step<STEPS.length-1) ? "visible":"hidden";
  const r = (P.step==="help") ? rHelp : ([rProjekt,rAI,rPlat,rDev,rIO,rSchema,rProg,rGen,rDocs][P.step] || rProjekt);
  $("view").innerHTML = "";
  r($("view"));
  window.scrollTo({top:0});
}
function stepDone(i){
  if(i===0) return !!P.meta.name;
  if(i===2) return P.platforms.length>0;
  if(i===3) return P.devices.length>0;
  return false;
}

  <div id="impResult"></div>

    const built = buildDevicesFromTags(res.tags);
    lastParse.built = built;
    let html = '<div class="oktxt">Rozpoznaný formát: <b>'+esc(res.fmt)+'</b> · '+res.tags.length+' tagů · '+built.devices.length+' zařízení</div>';

    html += '<div class="tablewrap"><table><thead><tr><th>Zařízení</th><th>Třída</th><th>Tagy</th></tr></thead><tbody>';

    }

}

/* --- 2 AI návrh --- */
let sampleFn; // undefined = zjišťuje se, null = nedostupné, funkce = připraveno
let aiBusy = false, aiCtl = null;
function aiInstr(){
  return 'Jsi zkušený návrhář průmyslové automatizace v nástroji PLC Studio. Z popisu stroje od uživatele navrhni sestavu zařízení pro řízení PLC.\n'
  +'Dostupné třídy zařízení (jiné neexistují):\n'
  +'- "Motor" (názvy M1, M2…): pohon/čerpadlo/dopravník; volby opt.fbk = zpětné hlášení běhu, opt.fault = vstup poruchy\n'
  +'- "Ventil" (Y1…): dvoupolohový ventil nebo pneumatický/hydraulický válec; volby opt.fbkOpen, opt.fbkClosed = koncové snímače\n'
  +'- "AnalogIn" (B1…): analogové měření; pole unit (jednotka), rmin, rmax (rozsah snímače)\n'
  +'- "AnalogOut" (U1…): analogový výstup (měnič, proporcionální ventil); unit, rmin, rmax\n'
  +'- "DI" (S1…): samostatný digitální vstup — tlačítko, světelná závora, koncák krytu, E-stop\n'
  +'- "DO" (H1…): samostatný digitální výstup — signálka, houkačka, zámek\n'
  +'Pravidla: vždy přidej E-stop jako DI (typicky S1 "Nouzové zastavení (NC)") a jeho název vrať v "estop"; bezpečnostní logiku NEnavrhuj, jen signál. Popisy piš česky a stručně. U analogů odhadni rozumný rozsah a jednotku.\n'
  +'Pokud z popisu plyne automatický cyklus, navrhni i sekvenci "seq": pole kroků {"dev":"M1","act":"start|stop|open|close|wait","cond":"fbk|time","timeS":číslo}; krok "wait" má dev:"", cond:"time".\n'
  +'Chybí-li ZÁSADNÍ informace (typ pohonů, počet os/válců, co se měří…), polož NEJVÝŠE 3 konkrétní otázky v "questions" a "devices" nech prázdné. Jinak "questions" nech prázdné a navrhni kompletní sestavu. Při upřesnění od uživatele vrať vždy CELOU aktualizovanou sestavu.\n'
  +'Odpověz POUZE jedním JSON objektem: {"questions":["…"],"devices":[{"name":"M1","cls":"Motor","desc":"…","opt":{"fbk":true,"fault":false},"unit":"","rmin":0,"rmax":100}],"estop":"S1","seq":[],"note":"stručné shrnutí návrhu a nejistot"}';
}
function aiNorm(r){
  const out = {questions:[], devices:[], estop:"", seq:[], note:""};
  if(!r || typeof r!=="object") return out;
  out.questions = Array.isArray(r.questions) ? r.questions.map(String).slice(0,3) : [];
  out.devices = (Array.isArray(r.devices)?r.devices:[]).filter(d=>d && CLS[d.cls]).map(d=>({
    name:String(d.name||"").trim(), cls:d.cls, desc:String(d.desc||"").trim(),
    opt:(d.opt&&typeof d.opt==="object")?d.opt:{}, unit:String(d.unit||""), rmin:Number(d.rmin)||0, rmax:(Number(d.rmax)||Number(d.rmax)===0)?Number(d.rmax):100
  }));
  out.estop = String(r.estop||"");
  out.seq = (Array.isArray(r.seq)?r.seq:[]).map(s=>({dev:String(s.dev||""), act:String(s.act||""), cond:s.cond==="time"?"time":"fbk", timeS:Number(s.timeS)||3}));
  out.note = String(r.note||"");
  return out;
}
function aiApply(){
  const pr = P.ai.last; if(!pr || !pr.devices.length) return;
  P.devices = []; P.io = []; P.nextId = 1;
  const byName = {};
  for(const d of pr.devices){
    const name = d.name || nextName(d.cls);
    const nd = {id:P.nextId++, name, cls:d.cls, desc:d.desc, opt:d.opt, unit:d.unit, rmin:d.rmin, rmax:d.rmax};
    P.devices.push(nd); byName[name] = nd;
  }
  syncIO();
  P.program.estop = (byName[pr.estop]||{}).id || "";
  P.program.seq = pr.seq
    .map(s=>({dev:(byName[s.dev]||{}).id||0, act:["start","stop","open","close","wait"].includes(s.act)?s.act:"wait", cond:s.cond, timeS:s.timeS}))
    .filter(s=>s.act==="wait" || s.dev);
  P.step = 3; save(); render();
}
function aiTurnView(t){
  if(t.role==="user") return '<div class="msg u"><span class="who">Ty</span>'+esc(t.content)+'</div>';
  let r = null; try{ r = aiNorm(JSON.parse(t.content)); }catch(e){}
  if(!r) return '<div class="msg a"><span class="who">AI</span>'+esc(t.content.slice(0,300))+'</div>';
  let h = '<div class="msg a"><span class="who">AI návrhář</span>';
  if(r.questions.length) h += '<b>Potřebuji upřesnit:</b><ul style="margin:4px 0;padding-left:18px">'+r.questions.map(q=>'<li>'+esc(q)+'</li>').join("")+'</ul>';
  if(r.devices.length) h += 'Navrženo <b>'+r.devices.length+' zařízení</b>'+(r.seq.length?' a sekvence o '+r.seq.length+' krocích':'')+'.';
  if(r.note) h += '<div class="hint" style="margin-top:4px">'+esc(r.note)+'</div>';
  return h+'</div>';
}
const AI_EXAMPLE = "Jednoúčelový lis na zalisování pouzder. Hydraulický agregát s čerpadlem, lisovací válec s koncáky, upínací ventil, měření tlaku do 250 bar a teploty oleje, světelná závora, kryt s koncákem, signalizace stavu. Automatický cyklus: upnout → lisovat 5 s → povolit.";
function rAI(el){
  const c = card(el,"02","AI návrh systému",`
  <p class="hint" style="margin-top:0;max-width:75ch">Popiš stroj vlastními slovy — co dělá, jaké má pohony, válce, co se měří a hlídá. AI navrhne sestavu zařízení, případně se nejdřív doptá na detaily. Návrh pak převezmeš a dál ho ručně doladíš v krocích Zařízení a Program.</p>
  <div class="chat" id="aiChat">${P.ai.turns.map(aiTurnView).join("")}</div>
  <textarea id="aiInput" style="margin-top:12px;min-height:90px" placeholder="Popiš stroj… (nebo klikni na Vložit příklad)">${esc(P.ai.draft||"")}</textarea>
  <div class="row">
    <button class="primary" id="aiSend" ${aiBusy?"disabled":""}>${P.ai.turns.length?"Odeslat upřesnění":"Navrhnout zařízení"}</button>
    <button class="small" id="aiExample" ${P.ai.turns.length?"hidden":""}>Vložit příklad</button>
    <button class="small" id="aiStop" ${aiBusy?"":"hidden"}>Stop</button>
    <button class="small danger" id="aiClear" ${P.ai.turns.length?"":"hidden"}>Nová konverzace</button>
    <span class="hint" style="margin:0" id="aiStatus"></span>
  </div>
  <div class="stream" id="aiStream" hidden></div>
  <div id="aiProposal"></div>`);
  const status = c.querySelector("#aiStatus"), ta = c.querySelector("#aiInput");
  if(sampleFn === undefined) status.textContent = "Připojuji AI…";
  else if(sampleFn === null) status.textContent = "AI není v tomto zobrazení dostupné — zařízení navrhni ručně v kroku Zařízení.";
  ta.addEventListener("input", ()=>{ P.ai.draft = ta.value; save(); });
  /* náhled posledního návrhu */
  const pr = P.ai.last;
  if(pr && pr.devices.length){
    let rows = pr.devices.map(d=>'<tr><td class="mono"><b>'+esc(d.name)+'</b></td><td>'+CLS[d.cls].label+'</td><td style="font-size:.8rem">'+esc(d.desc)+'</td><td style="font-size:.76rem;color:var(--muted)">'+esc(Object.entries(d.opt).filter(([,v])=>v).map(([k])=>k).join(", ")+(d.cls.startsWith("Analog")?(" "+d.unit+" "+d.rmin+"–"+d.rmax):""))+'</td></tr>').join("");
    c.querySelector("#aiProposal").innerHTML =
      '<h3>Navržená sestava</h3><div class="tablewrap"><table><thead><tr><th>Označení</th><th>Třída</th><th>Popis</th><th>Volby</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      (pr.seq.length?'<p class="hint">Sekvence: '+esc(pr.seq.map((s,i)=>(i+1)+". "+(s.act==="wait"?("výdrž "+s.timeS+" s"):(s.dev+" "+s.act))).join(" → "))+'</p>':'')+
      '<div class="row"><button class="primary" id="aiApplyBtn">Převzít návrh (nahradí zařízení)</button><span class="hint" style="margin:0">Nesedí? Napiš upřesnění a odešli znovu.</span></div>';
    c.querySelector("#aiApplyBtn").addEventListener("click", aiApply);
  }
  c.querySelector("#aiClear").addEventListener("click", ()=>{ P.ai = {turns:[], last:null, draft:""}; save(); render(); });
  c.querySelector("#aiExample").addEventListener("click", ()=>{ ta.value = AI_EXAMPLE; P.ai.draft = AI_EXAMPLE; save(); ta.focus(); status.textContent = ""; });
  c.querySelector("#aiStop").addEventListener("click", ()=>{ if(aiCtl) aiCtl.abort(); });
  c.querySelector("#aiSend").addEventListener("click", async ()=>{
    const msg = ta.value.trim();
    if(aiBusy) return;
    if(!msg){ status.textContent = "Nejdřív popiš stroj do pole výše (nebo klikni na Vložit příklad)."; ta.focus(); return; }
    if(sampleFn === undefined){
      status.textContent = "Připojuji AI…";
      try{ sampleFn = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("sample") : null; }
      catch(e){ sampleFn = null; }
    }
    if(!sampleFn){ status.textContent = "AI není v tomto zobrazení dostupné — zařízení navrhni ručně v kroku Zařízení."; return; }
    aiBusy = true;
    c.querySelector("#aiSend").disabled = true; c.querySelector("#aiStop").hidden = false;
    const sBox = c.querySelector("#aiStream"); sBox.hidden = false; sBox.textContent = "Přemýšlím…";
    status.textContent = "";
    P.ai.turns.push({role:"user", content:msg}); P.ai.draft = ""; save();
    aiCtl = new AbortController();
    try{
      const res = await sampleFn.json([{role:"user", content:aiInstr()}, ...P.ai.turns],
        {cache:false, signal:aiCtl.signal, onText:({text})=>{ sBox.textContent = text; }});
      P.ai.turns.push({role:"assistant", content:JSON.stringify(res)});
      const pr2 = aiNorm(res);
      if(pr2.devices.length) P.ai.last = pr2;
      save();
    }catch(e){
      P.ai.turns.pop(); // vrátit neodeslanou otázku do pole
      P.ai.draft = msg; save();
      const msgs = {not_granted:"Použití AI nebylo povoleno.", sampling_disabled:"AI není pro tento účet dostupné.", rate_limited:"Příliš mnoho dotazů — zkus to za chvíli.", refused:"AI tento dotaz odmítlo — přeformuluj ho.", invalid_json:"Odpověď se nepodařilo přečíst — zkus to znovu.", cancelled:""};
      status.textContent = (e && e.code in msgs) ? msgs[e.code] : "Nepodařilo se získat odpověď — zkus to znovu.";
    }finally{
      aiBusy = false; aiCtl = null; render();
    }
  });
}

    list.innerHTML = html+'</tbody></table></div>';
    list.querySelectorAll("input[data-f=desc]").forEach(i=>i.addEventListener("change",e=>{ const d=devById(+e.target.dataset.id); if(d){ d.desc=e.target.value; syncIO(); save(); } }));
    list.querySelectorAll("button[data-del]").forEach(b=>b.addEventListener("click",()=>{ P.devices = P.devices.filter(d=>d.id!==+b.dataset.del); P.program.seq = P.program.seq.filter(s=>s.act==="wait"||devById(s.dev)); if(P.program.estop && !devById(P.program.estop)) P.program.estop=""; syncIO(); save(); render(); }));
  } else list.innerHTML = '<p class="hint">Zatím žádná zařízení — přidej je výše, načti ukázku v kroku Projekt, nebo použij Import níže.</p>';
  importBlock(el);
}

/* --- 5 I/O --- */
function rIO(el){
  syncIO();
  const dup = {};
  for(const e of P.io){ if(e.addr) dup[e.addr]=(dup[e.addr]||0)+1; dup["t:"+e.tag]=(dup["t:"+e.tag]||0)+1; }
  let rows = "";
  for(const e of P.io){
    const d = devById(e.devId);
    rows += '<tr><td class="mono">'+esc(d?d.name:"?")+'</td>'+
      '<td class="mono dir'+e.dir+'">'+e.dir+'</td>'+
      '<td><input type="text" data-k="'+e.key+'" data-f="tag" value="'+esc(e.tag)+'" class="'+(dup["t:"+e.tag]>1?"dup":"")+'"></td>'+
      '<td><input type="text" data-k="'+e.key+'" data-f="addr" value="'+esc(e.addr)+'" class="'+(e.addr&&dup[e.addr]>1?"dup":"")+'" style="min-width:70px"></td>'+
      '<td style="text-align:center">'+(e.dir==="DI"?'<input type="checkbox" data-k="'+e.key+'" data-f="nc" '+(e.nc?"checked":"")+' aria-label="NC">':'—')+'</td>'+
      '<td><input type="text" data-k="'+e.key+'" data-f="cmt" value="'+esc(e.cmt)+'" style="min-width:160px"></td></tr>';
  }
  const c = card(el,"05","I/O mapování",`
  <div class="stats">
    <span class="stat">tagů <b>${P.io.length}</b></span>
    ${["DI","DO","AI","AO"].map(d=>'<span class="stat">'+d+' <b>'+P.io.filter(e=>e.dir===d).length+'</b></span>').join("")}
  </div>
  <div class="tablewrap"><table><thead><tr><th>Zařízení</th><th>Směr</th><th>Tag</th><th>Adresa</th><th>NC</th><th>Komentář</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="hint">žádná zařízení</td></tr>'}</tbody></table></div>
  <div class="row"><button class="small" id="bRenum">Přečíslovat adresy od nuly</button><span class="hint" style="margin:0">Adresy v Siemens notaci (%I0.0, %IW64) — pro ostatní platformy se převedou automaticky. NC = rozpínací kontakt (bezpečnostní prvky) — promítne se do elektrického schématu. Duplicity červeně.</span></div>`);
  c.querySelectorAll("input[data-k]").forEach(i=>i.addEventListener("change",e=>{
    const en = P.io.find(x=>x.key===e.target.dataset.k);
    if(!en) return;
    if(e.target.type==="checkbox") en.nc = e.target.checked;
    else en[e.target.dataset.f] = e.target.value.trim();
    save(); render();
  }));
  c.querySelector("#bRenum").addEventListener("click",()=>{ for(const e of P.io) e.addr=""; autoAddr(true); save(); render(); });
}

/* --- 5 Schéma (blokové + elektrické) --- */
function addrOrd(e){ const m=(e.addr||"").match(/%[IQ](W)?(\d+)(?:\.(\d+))?/); return m ? (m[1] ? 100000+(+m[2]) : (+m[2])*8+(+(m[3]||0))) : 999999; }
function modules(){
  const per = {DI:16, DO:16, AI:8, AO:4};
  const mods = [];
  for(const dir of ["DI","DO","AI","AO"]){
    const list = P.io.filter(e=>e.dir===dir).sort((a,b)=>addrOrd(a)-addrOrd(b));
    let idx = 1;
    for(let i=0;i<list.length;i+=per[dir]) mods.push({dir, idx:idx++, ch:list.slice(i,i+per[dir])});
  }
  return mods;
}
const SVTXT = 'font-family:var(--font-mono);font-size:12px;fill:currentColor';
const SVMUT = 'font-family:var(--font-mono);font-size:10.5px;fill:var(--muted)';
function sT(x,y,txt,st,anch){ return '<text x="'+x+'" y="'+y+'" style="'+(st||SVTXT)+'"'+(anch?' text-anchor="'+anch+'"':'')+'>'+esc(txt)+'</text>'; }
const MODLBL = {DI:"digitální vstupy", DO:"digitální výstupy", AI:"analogové vstupy", AO:"analogové výstupy"};

function svgBlock(mods){
  const hasIn = d=>P.io.some(e=>e.devId===d.id&&(e.dir==="DI"||e.dir==="AI"));
  const hasOut = d=>P.io.some(e=>e.devId===d.id&&(e.dir==="DO"||e.dir==="AO"));
  const L = P.devices.filter(hasIn), R = P.devices.filter(hasOut);
  const bh=34, g=10, top=56;
  const rows = Math.max(L.length, R.length, mods.length+2);
  const H = top + rows*(bh+g) + 20;
  const yy = i=>top+i*(bh+g);
  const box=(x,y,w,t1,t2,acc)=>
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+bh+'" rx="5" fill="'+(acc?'var(--chip)':'none')+'" stroke="'+(acc?'var(--accent)':'var(--line)')+'"/>'+
    sT(x+8,y+14,t1,SVTXT+';font-weight:600')+(t2?sT(x+8,y+27,String(t2).slice(0,34),SVMUT):'');
  let s = '';
  const plcH = (mods.length+2)*(bh+g)+14;
  s += '<rect x="340" y="'+(top-10)+'" width="300" height="'+plcH+'" rx="8" fill="none" stroke="var(--accent)" stroke-width="1.5"/>';
  s += sT(350, top-18, "PLC", SVTXT+';font-weight:700;fill:var(--accent)');
  s += sT(640, top-18, "zdroje signálů →  PLC  → akční členy", SVMUT, "end");
  s += box(352, yy(0), 276, "PS — zdroj 24 V DC", "napájení modulů a snímačů", false);
  s += box(352, yy(1), 276, "CPU", P.platforms.map(p=>PLAT[p].cpu).join(" · ")||"—", true);
  mods.forEach((m,i)=>{ s += box(352, yy(i+2), 276, m.dir+m.idx+" — "+MODLBL[m.dir], m.ch.length+" kanálů · svorkovnice X"+(i+1), false); });
  L.forEach((d,i)=>{ s += box(20, yy(i), 250, d.name, d.desc); });
  R.forEach((d,i)=>{ s += box(710, yy(i), 250, d.name, d.desc); });
  for(const e of P.io){
    const mi = mods.findIndex(m=>m.ch.includes(e)); if(mi<0) continue;
    const yMod = yy(mi+2)+bh/2;
    const d = devById(e.devId); if(!d) continue;
    if(e.dir==="DI"||e.dir==="AI"){ const li = L.indexOf(d); if(li>=0) s += '<line x1="270" y1="'+(yy(li)+bh/2)+'" x2="352" y2="'+yMod+'" stroke="var(--muted)" stroke-width="1"/>'; }
    else { const ri = R.indexOf(d); if(ri>=0) s += '<line x1="628" y1="'+yMod+'" x2="710" y2="'+(yy(ri)+bh/2)+'" stroke="var(--muted)" stroke-width="1"/>'; }
  }
  return '<svg role="img" aria-label="Blokové schéma: zařízení, moduly PLC a signálové cesty" viewBox="0 0 980 '+H+'" style="max-width:100%;height:auto" width="980" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}

/* Listy zapojení: jedna geometrie (ops) -> SVG náhled i DXF export (EPLAN/AutoCAD) */
function sheetOps(mod, xnum, page, total){
  const rows = mod.ch.length, rh = 40, top = 96;
  const W = 980, H = top + rows*rh + 104;
  const O = [];
  const Ln=(x1,y1,x2,y2,k)=>O.push({t:"l",x1,y1,x2,y2,k:k||"w"});
  const Ci=(cx,cy,r)=>O.push({t:"c",cx,cy,r});
  const Re=(x,y,w,h,k)=>O.push({t:"r",x,y,w,h,k:k||"s"});
  const Tx=(x,y,s,o)=>O.push(Object.assign({t:"t",x,y,s:String(s),size:11,anchor:"start",k:"t"},o||{}));
  /* rámeček s mřížkovými referencemi */
  Re(8,8,W-16,H-16,"f"); Re(26,26,W-52,H-52,"f");
  for(let i=1;i<8;i++){ const x=26+(W-52)/8*i; Ln(x,8,x,26,"f"); Ln(x,H-26,x,H-8,"f"); }
  for(let i=0;i<8;i++) Tx(26+(W-52)/8*(i+0.5), 20, i+1, {anchor:"middle",k:"m",size:9});
  const nR = Math.max(2, Math.round((H-52)/140));
  for(let i=1;i<nR;i++){ const y=26+(H-52)/nR*i; Ln(8,y,26,y,"f"); Ln(W-26,y,W-8,y,"f"); }
  for(let i=0;i<nR;i++) Tx(17, 26+(H-52)/nR*(i+0.5)+3, String.fromCharCode(65+i), {anchor:"middle",k:"m",size:9});
  /* popisové pole */
  const tx=W-26-420, ty=H-26-52;
  Re(tx,ty,420,52,"f"); Ln(tx,ty+26,tx+420,ty+26,"f"); Ln(tx+180,ty,tx+180,ty+52,"f"); Ln(tx+330,ty,tx+330,ty+52,"f");
  Tx(tx+7,ty+10,"Projekt",{k:"m",size:8});      Tx(tx+7,ty+22,(P.meta.name||"—").slice(0,32),{k:"b",size:9});
  Tx(tx+187,ty+10,"Výkres",{k:"m",size:8});     Tx(tx+187,ty+22,"Zapojení "+mod.dir+mod.idx+" · X"+xnum,{size:9});
  Tx(tx+337,ty+10,"List",{k:"m",size:8});       Tx(tx+337,ty+22,page+" / "+total,{size:9});
  Tx(tx+7,ty+36,"Kreslil",{k:"m",size:8});      Tx(tx+7,ty+48,"PLC Studio (návrh k revizi)",{size:9});
  Tx(tx+187,ty+36,"Datum",{k:"m",size:8});      Tx(tx+187,ty+48,dnes(),{size:9});
  Tx(tx+337,ty+36,"Rev",{k:"m",size:8});        Tx(tx+337,ty+48,"0.1",{size:9});
  /* potenciály a karta PLC */
  const yEnd = top + rows*rh - 12;
  const wBase = {DI:101, DO:201, AI:301, AO:401}[mod.dir];
  const isIn = (mod.dir==="DI"||mod.dir==="AI");
  if(isIn){
    Ln(80, top-28, 80, yEnd, "r"); Tx(80, top-36, "L+ (24 V DC)", {anchor:"middle",k:"b",size:10});
    Re(710, top-28, 200, rows*rh+8, "chip"); Tx(810, top-36, "PLC · "+mod.dir+mod.idx, {anchor:"middle",k:"b",size:10});
  } else {
    Re(46, top-28, 200, rows*rh+8, "chip"); Tx(146, top-36, "PLC · "+mod.dir+mod.idx, {anchor:"middle",k:"b",size:10});
    Ln(886, top-28, 886, yEnd, "r0"); Tx(886, top-36, "M (0 V)", {anchor:"middle",k:"b",size:10});
  }
  /* kanály */
  mod.ch.forEach((e,i)=>{
    const y = top + i*rh + 12;
    const d = devById(e.devId)||{};
    const wn = "-W"+(wBase+i);
    if(mod.dir==="DI"){
      Ln(80,y,300,y);
      Ln(300,y,324,y-13,"s");                       // pohyblivý kontakt (IEC 60617)
      if(e.nc) Ln(324,y,324,y-11,"s");              // doraz = rozpínací kontakt
      Ln(324,y,678,y);
      Tx(298,y-17,"-"+(d.name||""),{k:"b",size:10}); Tx(340,y-6,e.tag,{size:10});
      Tx(140,y-6,(d.desc||e.cmt||"").slice(0,25),{k:"m",size:9});
      Tx(500,y+12,wn,{k:"m",size:9});
      Ci(686,y,4); Tx(670,y+14,"X"+xnum+":"+(i+1),{anchor:"end",k:"m",size:9});
      Tx(720,y+3,mod.dir+" "+i+"  "+e.addr,{k:"m",size:9});
    } else if(mod.dir==="AI"){
      Ln(80,y,262,y);
      Re(262,y-12,96,24); Tx(310,y+3,"-"+(d.name||"B?"),{anchor:"middle",k:"b",size:10});
      Ln(358,y,678,y);
      Tx(140,y-6,(d.desc||"").slice(0,17),{k:"m",size:9});
      Tx(380,y-6,e.tag,{size:10}); Tx(380,y+12,"4–20 mA · "+wn,{k:"m",size:9});
      Ci(686,y,4); Tx(670,y+14,"X"+xnum+":"+(i+1),{anchor:"end",k:"m",size:9});
      Tx(720,y+3,"AI "+i+"  "+e.addr,{k:"m",size:9});
    } else if(mod.dir==="DO"){
      Tx(54,y+3,"DO "+i+"  "+e.addr,{k:"m",size:9});
      Ci(254,y,4); Tx(266,y+14,"X"+xnum+":"+(i+1),{k:"m",size:9});
      Ln(258,y,560,y);
      Re(560,y-9,26,18);                             // cívka/zátěž (IEC: obdélník)
      Tx(573,y-14,"-"+(d.name||""),{anchor:"middle",k:"b",size:10});
      Ln(586,y,886,y);
      Tx(276,y-6,e.tag,{size:10}); Tx(430,y+12,wn,{k:"m",size:9});
      Tx(610,y+14,(d.desc||e.cmt||"").slice(0,24),{k:"m",size:9});
    } else {
      Tx(54,y+3,"AO "+i+"  "+e.addr,{k:"m",size:9});
      Ci(254,y,4); Tx(266,y+14,"X"+xnum+":"+(i+1),{k:"m",size:9});
      Ln(258,y,540,y);
      Re(540,y-12,116,24); Tx(598,y+3,"-"+(d.name||"U?"),{anchor:"middle",k:"b",size:10});
      Ln(656,y,886,y);
      Tx(276,y-6,e.tag,{size:10}); Tx(400,y+12,"0/4–20 mA · 0–10 V · "+wn,{k:"m",size:9});
    }
  });
  if(mod.dir==="DI") Tx(80, yEnd+16, "Kontakty: šikmá páka s dorazem = NC (bezpečnostní prvky), bez dorazu = NO — dle sloupce NC v kroku I/O.", {k:"m",size:9});
  if(mod.dir==="AI") Tx(80, yEnd+16, "Dvouvodičové zapojení 4–20 mA; pro 0–10 V třívodičově (L+, signál, M).", {k:"m",size:9});
  return {W,H,O};
}
function opsToSVG(sh, label){
  const strokeFor = o => o.k==="f" ? "var(--line)" : o.k==="r" ? "var(--warn)" : o.k==="r0" ? "var(--muted)" : "currentColor";
  let s = "";
  for(const o of sh.O){
    if(o.t==="l") s += '<line x1="'+o.x1+'" y1="'+o.y1+'" x2="'+o.x2+'" y2="'+o.y2+'" stroke="'+strokeFor(o)+'" stroke-width="'+((o.k==="r"||o.k==="r0")?2:(o.k==="f"?1:1.2))+'"/>';
    else if(o.t==="c") s += '<circle cx="'+o.cx+'" cy="'+o.cy+'" r="'+o.r+'" fill="none" stroke="currentColor" stroke-width="1.2"/>';
    else if(o.t==="r") s += '<rect x="'+o.x+'" y="'+o.y+'" width="'+o.w+'" height="'+o.h+'" fill="'+(o.k==="chip"?"var(--chip)":"none")+'" stroke="'+(o.k==="chip"||o.k==="f"?"var(--line)":"currentColor")+'" stroke-width="'+(o.k==="f"?1:1.2)+'"/>';
    else s += '<text x="'+o.x+'" y="'+o.y+'" text-anchor="'+(o.anchor||"start")+'" style="font-family:var(--font-mono);font-size:'+o.size+'px;fill:'+(o.k==="m"?"var(--muted)":"currentColor")+(o.k==="b"?";font-weight:600":"")+'">'+esc(o.s)+'</text>';
  }
  return '<svg role="img" aria-label="'+esc(label)+'" viewBox="0 0 '+sh.W+' '+sh.H+'" style="max-width:100%;height:auto" width="'+sh.W+'" xmlns="http://www.w3.org/2000/svg">'+s+'</svg>';
}
function opsToDXF(sh){
  const H = sh.H, out = [];
  const layer = k => k==="f" ? "RAMECEK" : (k==="r"||k==="r0") ? "POTENCIALY" : (k==="chip") ? "PLC" : "SCHEMA";
  out.push("0","SECTION","2","ENTITIES");
  for(const o of sh.O){
    if(o.t==="l") out.push("0","LINE","8",layer(o.k),"10",o.x1,"20",H-o.y1,"30",0,"11",o.x2,"21",H-o.y2,"31",0);
    else if(o.t==="c") out.push("0","CIRCLE","8","SCHEMA","10",o.cx,"20",H-o.cy,"30",0,"40",o.r);
    else if(o.t==="r"){
      const p = [[o.x,o.y],[o.x+o.w,o.y],[o.x+o.w,o.y+o.h],[o.x,o.y+o.h],[o.x,o.y]];
      for(let i=0;i<4;i++) out.push("0","LINE","8",layer(o.k),"10",p[i][0],"20",H-p[i][1],"30",0,"11",p[i+1][0],"21",H-p[i+1][1],"31",0);
    } else {
      const txt = stripDia(String(o.s));
      let x = o.x; const w = txt.length*o.size*0.62;
      if(o.anchor==="middle") x -= w/2; else if(o.anchor==="end") x -= w;
      out.push("0","TEXT","8","TEXT","10",x,"20",H-o.y,"30",0,"40",o.size*0.8,"1",txt);
    }
  }
  out.push("0","ENDSEC","0","EOF");
  return out.join("\n");
}
function sheet(mod, xnum, page, total){
  const tot = total || modules().length;
  return opsToSVG(sheetOps(mod, xnum, page||xnum, tot), "Zapojení modulu "+mod.dir+mod.idx+" (svorkovnice X"+xnum+")");
}
function sheetDXF(mod, xnum, page, total){
  const tot = total || modules().length;
  return opsToDXF(sheetOps(mod, xnum, page||xnum, tot));
}

function svorkyCSV(mods){
  const l = ["Svorka;Modul;Kanál;Adresa;Tag;Komentář"];
  mods.forEach((m,mi)=>m.ch.forEach((e,i)=>l.push("X"+(mi+1)+":"+(i+1)+";"+m.dir+m.idx+";"+i+";"+e.addr+";"+e.tag+";"+(e.cmt||""))));
  return l.join("\n");
}
let svgStore = [];
function rSchema(el){
  syncIO();
  if(!P.io.length){ card(el,"06","Schéma","<p class='hint'>Nejdřív přidej zařízení (krok 4), nebo si je nech navrhnout v kroku AI návrh.</p>"); return; }
  const mods = modules();
  svgStore = [];
  const bd = svgBlock(mods); svgStore.push(bd);
  card(el,"06","Blokové schéma systému",
    '<div class="tablewrap"><figure style="margin:0">'+bd+'<figcaption class="hint">Zdroje signálů → moduly PLC → akční členy; čáry = jednotlivé signály, moduly navrženy z počtu I/O (DI16 / DO16 / AI8 / AO4).</figcaption></figure></div>'+
    '<div class="row"><button class="small" data-svg="0">Kopírovat SVG</button></div>');
  let inner = "";
  mods.forEach((m,i)=>{
    const s = sheet(m,i+1); svgStore.push(s);
    inner += '<h3>'+m.dir+m.idx+' — '+MODLBL[m.dir]+' (svorkovnice X'+(i+1)+')</h3>'+
      '<div class="tablewrap"><figure style="margin:0">'+s+'</figure></div>'+
      '<div class="row"><button class="small" data-svg="'+(svgStore.length-1)+'">Kopírovat SVG</button></div>';
  });
  card(el,"·","Elektrické zapojení I/O", inner+
    '<p class="warnbox"><b>Pozor:</b> NC/NO kontakty se kreslí podle sloupce NC v kroku I/O; čísla vodičů -W1xx dle potenciálových řad. Jištění, průřezy, relé na výstupech s větší zátěží a stínění analogů doplní projektant elektro — toto je podklad, ne výrobní dokumentace. Každý list je v kroku Dokumentace i jako <b>DXF</b> pro EPLAN/AutoCAD.</p>');
  let rowsHtml = "";
  mods.forEach((m,mi)=>m.ch.forEach((e,i)=>{
    const d = devById(e.devId)||{};
    rowsHtml += '<tr><td class="mono"><b>X'+(mi+1)+':'+(i+1)+'</b></td><td class="mono">'+m.dir+m.idx+'</td><td class="mono">'+i+'</td><td class="mono">'+esc(e.addr)+'</td><td class="mono">'+esc(e.tag)+'</td><td style="color:var(--muted);font-size:.78rem">'+esc((d.name?d.name+" · ":"")+(e.cmt||""))+'</td></tr>';
  }));
  const c3 = card(el,"·","Svorkovnice",
    '<div class="tablewrap"><table><thead><tr><th>Svorka</th><th>Modul</th><th>Kanál</th><th>Adresa</th><th>Tag</th><th>Zařízení / komentář</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    '<div class="row"><button class="small" id="bCsv">Kopírovat svorkovnici (CSV)</button><span class="hint" style="margin:0">Podklad pro projektanta elektro (EPLAN apod.).</span></div>');
  c3.querySelector("#bCsv").addEventListener("click",()=>copyText(svorkyCSV(mods), c3.querySelector("#bCsv")));
  el.querySelectorAll("[data-svg]").forEach(b=>b.addEventListener("click",()=>copyText(svgStore[+b.dataset.svg], b)));
}

/* --- 6 Program --- */
function rProg(el){
  const diDevs = P.devices.filter(d=>d.cls==="DI");
  const actDevs = P.devices.filter(d=>d.cls==="Motor"||d.cls==="Ventil");
  const c = card(el,"07","Logika programu",`
  <div class="grid g2">
    <label class="f">Centrální uvolnění (E-stop / bezpečnostní vstup)
      <select id="pEstop"><option value="">— žádný (doplníš ručně) —</option>${diDevs.map(d=>'<option value="'+d.id+'" '+(P.program.estop===d.id?"selected":"")+'>'+esc(d.name+" – "+d.desc)+'</option>').join("")}</select>
    </label>
    <div class="f" style="justify-content:end"><span class="hint" style="margin:0">Signál se zapojí do <code>enable</code> všech bloků. Skutečnou bezpečnost řeší safety technika, ne program — viz Nápověda.</span></div>
  </div>
  <h3>Automatická sekvence (volitelné)</h3>

    list.querySelectorAll("[data-dn]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.dn; [P.program.seq[i+1],P.program.seq[i]]=[P.program.seq[i],P.program.seq[i+1]]; save(); render(); }));

let genCache = null, outerTab = 0, innerTab = 0;
function rGen(el){
  syncIO();
  if(!P.devices.length){ card(el,"08","Generování","<p class='hint'>Nejdřív přidej zařízení (krok 4), nech si je navrhnout v kroku AI návrh, nebo použij volbu Import.</p>"); return; }

  genCache = {};
  for(const p of P.platforms) genCache[p] = genFor(p);
  const plats = P.platforms;
  if(outerTab>=plats.length) outerTab=0;
  const files = Object.keys(genCache[plats[outerTab]]);
  if(innerTab>=files.length) innerTab=0;
  const c = card(el,"08","Generované zdroje",`
  <div class="tabs outer" role="tablist">${plats.map((p,i)=>'<button role="tab" aria-selected="'+(i===outerTab)+'" data-o="'+i+'">'+PLAT[p].name+'</button>').join("")}</div>
  <div class="tabs" role="tablist" style="margin-top:8px">${files.map((f,i)=>'<button role="tab" aria-selected="'+(i===innerTab)+'" data-f="'+i+'">'+f+'</button>').join("")}</div>
  <div class="codebox"><pre class="code" id="genCode"></pre><button class="copybtn" id="bCopyGen">Kopírovat</button></div>
  <p class="note">Soubor zkopíruj a ulož jako UTF-8 pod názvem záložky. Postup importu pro danou platformu je v záložce <b>README.txt</b>. Výstup je výchozí kostra — TODO komentáře označují místa k doplnění.</p>`);
  const show = ()=>{ c.querySelector("#genCode").textContent = genCache[plats[outerTab]][Object.keys(genCache[plats[outerTab]])[innerTab]]; };
  show();
  c.querySelectorAll("[data-o]").forEach(b=>b.addEventListener("click",()=>{ outerTab=+b.dataset.o; innerTab=0; render(); }));
  c.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{ innerTab=+b.dataset.f; c.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-selected", x===b)); show(); }));

}
function copyText(txt, btn){
  const done = ()=>{ const t = btn.textContent; btn.textContent = "Zkopírováno"; setTimeout(()=>btn.textContent=t,1500); };
  try{ navigator.clipboard.writeText(txt).then(done).catch(()=>{}); }catch(e){}
}
