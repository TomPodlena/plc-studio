  }
  const c = card(el,"09","Dokumentace projektu",`
  <p class="hint" style="margin-top:0;max-width:78ch">Z návrhu se generuje dokumentace běžného automatizačního projektu: funkční specifikace (FDS), I/O list, svorkovnice, seznam alarmů, testovací protokol FAT, kostra návodu k obsluze, SW dokumentace, schémata a zdrojové kódy zvolených platforem. Vyber soubor vlevo, prohlédni ho a ulož, kam potřebuješ. Vše je návrh k revizi; co sada nepokrývá, vypisuje Přehled.</p>
  <div class="docgrid">
    <div class="doclist" role="tablist">${listHtml}</div>
    <div style="min-width:0">
      <div class="row" style="margin:0 0 10px">
        <button class="primary" id="bDocSave">Stáhnout soubor</button>
        <button class="small" id="bDocCopy">Kopírovat</button>
        <span class="hint" style="margin:0;font-family:var(--font-mono);font-size:.72rem" id="docName"></span>
        <span class="hint" style="margin:0" id="docStatus"></span>
      </div>
      <div id="docPane"></div>
    </div>
  </div>
  <p class="note">Každý soubor se ukládá jednotlivě — prohlížeč se zeptá na potvrzení a místo uložení. Soubory platforem se ukládají s předponou platformy (např. <code>siemens_Gen_Main.scl</code>), ať se v jednom adresáři nepletou.</p>`);
  const pane = c.querySelector("#docPane"), nameEl = c.querySelector("#docName"), status = c.querySelector("#docStatus");
  const show = ()=>{
    const f = files[docTab];
    nameEl.textContent = "→ "+f.save;
    status.textContent = "";
    if(f.kind==="svg"){ pane.innerHTML = '<div class="svgprev">'+f.body+'</div>'; }
    else if(f.kind==="dxf"){ pane.innerHTML = '<p class="hint" style="margin:0 0 8px">Náhled výkresu — uloží se jako DXF pro EPLAN / AutoCAD / LibreCAD.</p><div class="svgprev">'+f.prev+'</div>'; }
    else { pane.innerHTML = '<div class="codebox"><pre class="code" style="border-radius:8px;max-height:520px"></pre></div>'; pane.querySelector("pre").textContent = f.body; }
    c.querySelectorAll("[data-d]").forEach(b=>b.setAttribute("aria-selected", String(+b.dataset.d===docTab)));
  };
  show();
  c.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{ docTab=+b.dataset.d; show(); }));
  c.querySelector("#bDocCopy").addEventListener("click",()=>copyText(files[docTab].body, c.querySelector("#bDocCopy")));
  c.querySelector("#bDocSave").addEventListener("click", async ()=>{
    if(downloadsFn === undefined){
      status.textContent = "Připojuji stahování…";
      try{ downloadsFn = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){ downloadsFn = null; }
    }
    if(!downloadsFn){ status.textContent = "Stahování není v tomto zobrazení dostupné — použij Kopírovat."; return; }
    try{ status.textContent = ""; await downloadsFn.save({filename:files[docTab].save, data:files[docTab].body}); status.textContent = "Uloženo."; setTimeout(()=>{ if(status.textContent==="Uloženo.") status.textContent=""; },2000); }
    catch(e){ if(e && e.code!=="cancelled") status.textContent = "Uložení se nepodařilo."; }
  });
}

/* --- Nápověda (mimo kroky) --- */
function rHelp(el){
  const H = (t,b)=>'<details class="help"><summary>'+t+'</summary><div class="body">'+b+'</div></details>';
  const c = document.createElement("section");
  c.className = "card";
  c.innerHTML = '<h2><span class="n">?</span>Škola PLC — nápověda pro začátečníky</h2>'
  + H("Co je PLC a jak funguje", `
    <p>PLC (programovatelný logický automat) je průmyslový počítač, který řídí stroj: čte vstupy (tlačítka, snímače), vyhodnotí program a nastaví výstupy (stykače, ventily, signálky). Na rozdíl od běžného PC je stavěný na nepřetržitý provoz, rušení a teploty v rozvaděči.</p>
    <p><b>Scan cyklus</b> — srdce každého PLC: <b>1)</b> načti všechny fyzické vstupy do paměti, <b>2)</b> vykonej celý program odshora dolů, <b>3)</b> zapiš výsledky na fyzické výstupy. To se opakuje typicky každých 1–10 ms. Důsledky: program nikdy „nečeká" uvnitř (žádné nekonečné smyčky!), a stav, který má přežít do dalšího cyklu, musí být uložený v proměnné.</p>
    <p>Typický projekt = <b>HW konfigurace</b> (CPU + I/O karty) + <b>tagy/proměnné</b> (pojmenované signály) + <b>program</b> (bloky).</p>`)
  + H("Vstupy a výstupy (DI / DO / AI / AO)", `
    <ul>
      <li><b>DI</b> — digitální vstup, 24 V DC: tlačítko, koncák, čidlo. Jen 0/1.</li>
      <li><b>DO</b> — digitální výstup: cívka stykače, ventil, signálka. Pozor na proudovou zatížitelnost — větší zátěž přes relé/stykač.</li>
      <li><b>AI</b> — analogový vstup: 0–10 V nebo 4–20 mA (tlak, teplota…). V programu přijde „surové číslo" (Siemens 0–27648), které se škáluje na fyzikální jednotky — přesně to dělá generovaný FB_AnalogIn. Výhoda 4–20 mA: přerušený vodič poznáš (0 mA = porucha).</li>
      <li><b>AO</b> — analogový výstup: žádaná hodnota pro frekvenční měnič, proporcionální ventil.</li>
    </ul>
    <p><b>NC vs. NO:</b> bezpečnostní signály (E-stop, koncáky krytů) se zapojují jako NC (rozpínací) — drát TRUE = v pořádku. Přerušený vodič se pak projeví jako zastavení, ne jako „vše OK". Proto v generovaném kódu E-stop = TRUE znamená „můžeš jet".</p>`)
  + H("Jazyky IEC 61131-3 — kterým psát", `
    <ul>
      <li><b>LAD (ladder)</b> — „žebříček" z kontaktů a cívek. Čte ho i údržba u stroje; ideální na jednoduché blokování a bezpečnostní podmínky.</li>
      <li><b>FBD</b> — grafické bloky; oblíbené na analogovou/signálovou logiku.</li>
      <li><b>ST / SCL</b> — textový jazyk podobný Pascalu. Nejlepší na výpočty, stavové automaty, práci s daty. <b>Tímto jazykem generuje PLC Studio</b> — je přenositelný mezi platformami.</li>
      <li><b>SFC / GRAPH</b> — sekvenční diagramy (kroky a přechody) na velké sekvence.</li>
      <li><b>IL/STL</b> — historický „assembler", dnes jen údržba starého kódu.</li>
    </ul>
    <p>Dobrá praxe: logika strojů v ST, zásahové/bezpečnostní podmínky v LAD, ať je údržba přečte.</p>`)
  + H("Stavební bloky programu (FB, FC, DB, instance)", `
    <ul>
      <li><b>FC (funkce)</b> — bez paměti; výpočty, převody. Stejné vstupy → stejný výsledek.</li>
      <li><b>FB (funkční blok)</b> — má vlastní paměť (<i>instanci</i>). Jeden FB_Motor, deset motorů = deset instancí; každá si pamatuje svůj stav. Tohle je základ znovupoužitelnosti.</li>
      <li><b>DB / globální proměnné</b> — datové úložiště (recepty, HMI data).</li>
      <li><b>UDT / struktury</b> — vlastní datové typy, např. „stav motoru" = run+error+status pohromadě.</li>
      <li><b>OB / task</b> — vstupní body: cyklický program, časové přerušení, reakce na chybu (u Siemens OB82/86/121/122 — bez nich jde CPU při poruše periferie do STOP!).</li>
    </ul>
    <p>Pravidlo: <b>žádné magické bity a absolutní adresy v logice</b> — všechno symbolicky přes tagy, zařízení jako instance FB. Přesně tak staví program generátor.</p>`)
  + H("Stavové automaty a časovače — vzor, který generátor používá", `
    <p>Každé zařízení i sekvence je <b>stavový automat</b>: proměnná „krok" + CASE. V každém kroku se dělá jedna věc a hlídá se podmínka přechodu. Výhody: čitelné, laditelné (vidíš číslo kroku), každý čekací krok může mít timeout do chybového stavu.</p>
    <p>Kostra: <code>CASE statStep OF 0: klid … 10: rozběh (timeout!) … 20: běh … 90: porucha END_CASE</code>. Chybový krok drží zařízení vypnuté, odchod jen kvitací.</p>
    <p><b>Časovače:</b> TON (zpožděné sepnutí) je nejčastější — „když podmínka trvá X s". <b>Detekce hrany</b> (reakce na stisk, ne držení): R_TRIG, nebo ručně <code>trig := sig AND NOT lastSig; lastSig := sig;</code> — generovaný kód používá obojí.</p>`)
  + H("Bezpečnost — co NIKDY neřešit jen programem", `
    <p>Nouzové zastavení, blokování krytů, dvouruční ovládání a podobné funkce jsou <b>bezpečnostní funkce</b> podle ISO 13849 / IEC 62061. Musí je zajistit certifikovaná technika: bezpečnostní relé, nebo safety PLC (Siemens F-CPU, Pilz, Sick…), se správnou kategorií/PL dle posouzení rizik stroje.</p>
    <p>Běžný program s bezpečnostním signálem jen <i>pracuje</i> (zastaví sekvenci, zobrazí hlášku) — nesmí být jediné, co člověka chrání. Generované <code>enable</code> je proto jen informativní vrstva nad skutečným safety okruhem. U nás v EU je to součást posouzení shody stroje (CE, směrnice o strojních zařízeních / nařízení 2023/1230).</p>`)
  + H("Přehled platforem", `
    <div class="tablewrap"><table><thead><tr><th>Výrobce</th><th>IDE</th><th>Typické CPU</th><th>Jazyk zde</th><th>Import z PLC Studio</th></tr></thead><tbody>
    ${Object.values(PLAT).map(p=>'<tr><td><b>'+p.name+'</b></td><td>'+p.ide+'</td><td>'+p.cpu+'</td><td class="mono">'+p.lang+'</td><td style="font-size:.78rem">'+p.imp+'</td></tr>').join("")}
    </tbody></table></div>
    <p>Všechny vycházejí z IEC 61131-3, takže ST logika je přenositelná s malými úpravami (časovače u Rockwellu, datové typy, adresace I/O). Hlavní rozdíly jsou v IDE, HW konfiguraci a komunikacích (Profinet vs. EtherNet/IP vs. EtherCAT vs. CC-Link).</p>`)
  + H("Blokové a elektrické schéma — jak je číst", `
    <p><b>Blokové schéma</b> (krok 5) ukazuje architekturu systému: vlevo zdroje signálů (snímače, zpětná hlášení), uprostřed sestava PLC — zdroj 24 V, CPU a I/O moduly navržené automaticky z počtu signálů (DI16, DO16, AI8, AO4) — vpravo akční členy. Každá čára je jeden signál.</p>
    <p><b>Elektrické zapojení</b> kreslí každý kanál modulu: u DI vede +24 V přes kontakt zařízení na vstupní svorku; u DO jde výstupní svorka přes zátěž (cívka, signálka) na 0 V; analogy jako proudová smyčka 4–20 mA (dvouvodič) nebo 0–10 V (třívodič). Svorky jsou číslované X1:1, X1:2… po modulech — tabulka <b>Svorkovnice</b> jde zkopírovat jako CSV pro projektanta.</p>
    <p>Pozor: je to <i>podklad</i>, ne výrobní dokumentace — kontakty jsou obecně NO (bezpečnostní prvky se zapojují NC), chybí jištění, stínění, průřezy vodičů a rozvaděčová dispozice. To patří do rukou projektanta elektro (EPLAN apod.).</p>`)
  + H("Migrace projektu mezi platformami", `
    <p>Postup v PLC Studio: <b>1)</b> exportuj ze zdrojové platformy tagy/GVL (u Siemens tabulku tagů přes Openness, u Rockwellu L5X/CSV…), <b>2)</b> volba Import v kroku Zařízení — nástroj sestaví zařízení a I/O, <b>3)</b> zkontroluj třídy zařízení a adresy, <b>4)</b> vyber cílovou platformu a vygeneruj.</p>
    <p><b>Co se přenese dobře:</b> struktura zařízení, tagy, komentáře, logika typových zařízení (znovu vygenerovaná ze šablon). <b>Co je vždy ruční práce:</b> HW konfigurace, komunikace, safety, vizualizace/HMI a specifická procesní logika — tu je potřeba přepsat podle inventáře bloků z importu.</p>`)
  + H("Slovníček", `
    <ul>
      <li><b>Tag / proměnná</b> — pojmenovaný signál nebo paměťové místo.</li>
      <li><b>Instance</b> — paměť jednoho konkrétního použití FB.</li>
      <li><b>Scan</b> — jeden průchod programu (vstupy→logika→výstupy).</li>
      <li><b>Interlock</b> — blokovací podmínka („nespouštěj, dokud…").</li>
      <li><b>HMI</b> — operátorský panel / vizualizace.</li>
      <li><b>Retain</b> — proměnná přežívající vypnutí napájení.</li>
      <li><b>Watchdog</b> — hlídání maximální doby cyklu.</li>
      <li><b>Openness / L5X / PLCopen XML</b> — formáty a API pro strojovou výměnu projektů; přes ně se automatizuje import.</li>
      <li><b>PLCSIM, Logix Echo, GX Simulator…</b> — simulátory CPU pro testy bez hardwaru.</li>
    </ul>`)
  + H("Jak pracovat s tímto nástrojem", `
    <ol style="padding-left:20px">
      <li><b>Projekt</b> — pojmenuj; nebo si načti ukázku a projdi ji.</li>
      <li><b>AI návrh</b> — popiš stroj vlastními slovy, AI navrhne zařízení a sekvenci (případně se doptá) a návrh převezmeš.</li>
      <li><b>Platformy</b> — vyber cílové systémy (klidně víc najednou).</li>
      <li><b>Zařízení</b> — doladíš sestavu ručně; existující projekt lze převzít vedlejší volbou Import dole.</li>
      <li><b>I/O</b> — zkontroluj tagy a adresy, přečísluj podle skutečného zapojení.</li>
      <li><b>Schéma</b> — blokové schéma systému, elektrické zapojení I/O a svorkovnice.</li>
      <li><b>Program</b> — vyber E-stop a naklikej automatickou sekvenci.</li>
      <li><b>Generovat</b> — zkopíruj soubory, README říká přesný postup importu.</li>
      <li><b>Dokumentace</b> — stáhni kompletní balík projektu (FDS, I/O list, alarmy, FAT protokol, návod, schémata, kódy) jako ZIP.</li>
    </ol>
    <p>Kdykoli se vrať a změň vstupy — výstupy se přegenerují. Návrh zůstává uložený v tomto prohlížeči; přes Export JSON (krok Projekt) si ho přeneseš či zazálohuješ.</p>`);
  el.appendChild(c);
}

/* ============================================================ start */
$("btnPrev").addEventListener("click",()=>{ if(typeof P.step==="number" && P.step>0){ P.step--; save(); render(); }});
$("btnNext").addEventListener("click",()=>{ if(typeof P.step==="number" && P.step<STEPS.length-1){ P.step++; save(); render(); }});
try{
  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("sample").then(f=>{ sampleFn = f; if(P.step===1) render(); }).catch(()=>{ sampleFn = null; if(P.step===1) render(); });
    window.claude.use("downloads").then(f=>{ downloadsFn = f; if(P.step===8) render(); }).catch(()=>{ downloadsFn = null; });
  } else { sampleFn = null; downloadsFn = null; }
}catch(e){ sampleFn = null; downloadsFn = null; }
load();
if(!P.devices.length && !P.meta.name) loadSample();
else render();
</script>
